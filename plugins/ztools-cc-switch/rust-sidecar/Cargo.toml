[package]
name = "cc-switch-sidecar"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
