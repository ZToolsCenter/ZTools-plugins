<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>汇率计算</title>
    <link rel="stylesheet" href="./plugin/layui/css/layui.css"/>
    <link rel="stylesheet" href="./css/native.css"/>
    <link rel="stylesheet" href="./css/markdown.css"/>
    <link rel="stylesheet" href="./css/index.css"/>
    <script type="text/javascript" src="./js/jquery/jquery.js"></script>
    <script type="text/javascript" src="./preload.js"></script>
    <script type="text/javascript" src="./plugin/confetti/confetti.browser.js"></script>
    <script type="text/javascript" src="./plugin/layui/layui.js"></script>
    <script type="text/javascript" src="./plugin/layuiExt/layui.config.js"></script>
    <script type="text/javascript" src="./plugin/showdown/showdown.min.js"></script>
    <script type="text/javascript" src="./js/utils/commonUtils.js"></script>
    <script type="text/javascript" src="./js/utils/uToolsUtils.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
</head>
<body>
<form class="layui-form  layui-form-pane" action="" lay-filter="form1" style="margin: 20px;">

    <div class="layui-row">
        <div class="layui-col-sm3">
            <div class="layui-form-item">
                <label class="layui-form-label">小数位数</label>
                <div class="layui-input-block">
                    <input type="number" id="digit" name="digit" lay-filter="digit" placeholder="" autocomplete="off" class="layui-input" min="0" max="20" step="1" lay-affix="number">
                </div>
            </div>
        </div>
        <div class="layui-col-sm3">
            <div class="layui-form-item" id="divHbList">
                <select id="hbList" name="hbList" lay-filter="hbList" lay-search=""></select>
            </div>
        </div>
        <div class="layui-col-sm3">
            <div class="layui-form-item">
                <input type="checkbox" id="showAbandon" name="showAbandon" lay-filter="showAbandon" lay-text="显示'已废弃'的货币">
                <input type="checkbox" id="darkMode" name="darkMode" lay-filter="darkMode" lay-text="深色模式">
            </div>
        </div>
        <div class="layui-col-sm2">
            <div class="layui-form-item">
                <p class="refresh-rate" title="点击刷新汇率">
                    汇率更新时间
                    <i class="layui-icon layui-icon-refresh-3"></i>
                    <br>
                    <span id="rateTimeStr" class="rateTimeStr"></span>
                </p>
            </div>
        </div>
    </div>

    <div class="layui-row">
        <div class="layui-col-sm12">
            <table class="layui-hide" id="tableList1"></table>
            <script type="text/html" id="toolOpenTrend">
                <a class="layui-btn layui-btn-xs btn-trend" lay-event="trend" title="查看汇率趋势">趋势</a>
            </script>
            <input type="hidden" id="allHistoryRatesList" value="[]">
        </div>
    </div>

    <hr>

    <div class="layui-row">
        <div class="layui-col-sm12">
            <table class="layui-hide" id="tableList"></table>
            <script type="text/html" id="toolEvent">
                <a class="layui-btn layui-btn-primary layui-border-red layui-btn-xs" lay-event="del" title="双击移除此货币">移除</a>
            </script>
        </div>
    </div>

</form>
<a class="shang" id="btnShang" href="javascript:void(0);" title="Buy me coffee ☕ ~">
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 64 64"><path fill="currentColor" d="M54.2 25.7c-1.3 0-2.6.3-3.7.9c-.2-3.2-2.9-5.7-6.1-5.7H9.3c-3.4 0-6.1 2.7-6.1 6.1v9.5c0 9.2 5.9 17 14.1 19.9H4c-1.2 0-2.3 1-2.3 2.3S2.7 61 4 61h45.8c1.2 0 2.3-1 2.3-2.3s-1-2.3-2.3-2.3H36.4c5.9-2.1 10.5-6.7 12.7-12.4c1.4 1.1 3.2 1.8 5.1 1.8c2.2 0 4.4-.9 5.9-2.5c1.5-1.5 2.2-3.5 2.1-5.5v-4.1c0-4.4-3.5-8-8-8M46 36.5c0 9.2-7.5 16.7-16.7 16.7h-4.9c-9.2 0-16.7-7.5-16.7-16.7V27c0-.9.7-1.6 1.6-1.6h35.1c.9 0 1.6.7 1.6 1.6zm10.9 3.8c-.7.7-1.6 1.1-2.6 1.1c-1.9 0-3.5-1.6-3.5-3.5v-4.1c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5V38c0 .8-.3 1.6-.9 2.3M13.8 16.5c1.2 0 2.3-1 2.3-2.3V5.3c0-1.2-1-2.3-2.3-2.3s-2.3 1-2.3 2.3v8.9c0 1.3 1.1 2.3 2.3 2.3m13.1 0c1.2 0 2.3-1 2.3-2.3V5.3c0-1.2-1-2.3-2.3-2.3s-2.3 1-2.3 2.3v8.9c0 1.3 1 2.3 2.3 2.3m13.1 0c1.2 0 2.3-1 2.3-2.3V5.3c0-1.2-1-2.3-2.3-2.3s-2.3 1-2.3 2.3v8.9c0 1.3 1 2.3 2.3 2.3"/></svg>
</a>
</body>
</html>
