<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>压缩包管家</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><p>受限压缩包工作台</p><h1>压缩包管家</h1></div><span id="status">ZIP 预览已就绪</span></header><section class="panel intake"><button id="chooseZip">选择 ZIP</button><button id="inspect">预览安全预案</button><button id="chooseDestination">选择解压位置</button><button id="extract" class="warn">按重命名策略解压</button><button id="chooseFiles">选择要压缩的文件</button><button id="create">创建 ZIP</button></section><section class="grid"><article class="panel"><h2>压缩包目录树</h2><ul id="tree"><li>尚未选择压缩包。</li></ul></article><aside class="panel safety"><h2>写入边界</h2><p id="summary">预览期间不会写入任何内容。解压必须单独授权目标目录，遇到同名文件时默认重命名。</p><p>插件会拒绝已有符号链接并重新检查路径，但不能作为抵御同一账户恶意并发进程的沙箱。当前仅规划 TAR/TGZ 支持，暂不接受此类文件。</p><button id="copy">复制解压预案</button></aside></section></main><script type="module" src="./app.mjs"></script></body></html>
