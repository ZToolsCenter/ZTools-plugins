<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo.png">
<title>spotlight-overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* 入场不做整体淡入：黑幕通过“亮洞半径收缩”实现从四角向鼠标收拢 */
  #stage {
    position: fixed; inset: 0;
  }
  /*
   * 聚光灯光斑：
   * 圆形 div + 超大扩散 box-shadow → 圆外区域被暗色覆盖，圆内保持明亮。
   * blur 形成柔化边缘；位移只改 transform，由合成器处理，保证跟随流畅。
   */
  #spot {
    position: fixed; left: 0; top: 0;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
    transform: translate3d(-9999px, -9999px, 0);
  }
  /* 底部提示条 */
  #tip {
    position: fixed; left: 50%; bottom: 5%;
    transform: translateX(-50%);
    padding: 8px 22px;
    border-radius: 22px;
    background: rgba(20, 22, 28, 0.82);
    border: 1px solid rgba(255, 207, 110, 0.35);
    color: #ffcf6e;
    font: 13px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }
  #tip.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="spot"></div>
  <div id="tip">移动鼠标指示位置 · Esc 或点击退出</div>
</div>
<script src="overlay.js"></script>
</body>
</html>
