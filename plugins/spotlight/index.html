<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>聚光灯设置</title>
<style>
  :root {
    --bg: #14161b;
    --panel: #1d2027;
    --panel-2: #23262f;
    --border: #2e323d;
    --text: #e8eaf0;
    --text-dim: #9aa0ae;
    --accent: #ffcf6e;
    --accent-soft: rgba(255, 207, 110, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    overflow: hidden auto;
    user-select: none;
  }

  .wrap { padding: 20px 24px 28px; max-width: 720px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo-img {
    width: 40px; height: 40px; border-radius: 10px;
    flex: none; display: block;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 1px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); }

  /* 快捷键 */
  .hotkey-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .hint code {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--accent);
    font-family: "Cascadia Code", Consolas, monospace;
  }

  .btn {
    padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    background: var(--accent); color: #2a2210;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  /* 滑杆 */
  .slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row > label { width: 64px; flex: none; color: var(--text); }
  .slider-row .val {
    width: 76px; flex: none; text-align: right;
    color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--panel-2) var(--p, 50%));
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* 开关 */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; cursor: pointer; }
  .switch input { display: none; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 11px;
    background: var(--panel-2); border: 1px solid var(--border);
    transition: background .15s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--text-dim);
    transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); background: var(--accent); }

  /* 实时预览 */
  #preview {
    position: relative; height: 240px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
    background:
      linear-gradient(135deg, #2b3440 0%, #1f2833 40%, #25313d 70%, #1a2230 100%);
    cursor: none;
  }
  #preview .scene { position: absolute; inset: 0; padding: 22px; }
  #preview .fake-title { width: 42%; height: 14px; border-radius: 7px; background: rgba(255,255,255,.35); margin-bottom: 14px; }
  #preview .fake-line { height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); margin-bottom: 9px; }
  #preview .fake-line.short { width: 60%; }
  #preview .fake-block {
    margin-top: 18px; width: 130px; height: 56px; border-radius: 8px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.12);
  }
  #preview .p-spot {
    position: absolute; left: 0; top: 0;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
  }
  #preview .p-tip {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 11px; color: rgba(255,255,255,.45);
  }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 6px; line-height: 1.8; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
    background: var(--panel-2); border: 1px solid var(--accent);
    color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 7px 18px; border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 进入“开启聚光灯”功能时隐藏设置界面，避免闪烁 */
  body.activating .wrap, body.activating footer { visibility: hidden; }
</style>
</head>
<body class="activating">
<div class="wrap">
  <header>
    <img class="logo-img" src="logo.png" alt="聚光灯">
    <div>
      <h1>聚光灯</h1>
      <p>全屏变暗，光圈跟随鼠标指针，随时聚焦注意力</p>
    </div>
  </header>

  <div class="card">
    <h2>快捷键</h2>
    <div class="hotkey-row">
      <button id="bindBtn" class="btn ghost">去绑定全局快捷键</button>
      <button id="testBtn" class="btn">立即开启聚光灯</button>
    </div>
    <p class="hint" style="margin-top:12px">
      点击「去绑定全局快捷键」跳转 ZTools 快捷键设置页，为本插件的「聚光灯」功能录入组合键（如
      <code>Ctrl+Alt+S</code>）即可全局唤起。
      开启聚光灯后，按 <code>Esc</code> 或点击屏幕任意处退出。
    </p>
  </div>

  <div class="card">
    <h2>光圈与明暗</h2>
    <div class="slider-row">
      <label>光圈大小</label>
      <input id="radius" type="range" min="60" max="600" step="10" value="180">
      <span class="val" id="radiusVal">180 px</span>
    </div>
    <div class="slider-row">
      <label>背景暗度</label>
      <input id="opacity" type="range" min="30" max="95" step="1" value="75">
      <span class="val" id="opacityVal">75%</span>
    </div>
    <div class="slider-row">
      <label>边缘柔化</label>
      <input id="softness" type="range" min="0" max="150" step="5" value="60">
      <span class="val" id="softnessVal">60 px</span>
    </div>
    <div class="toggle-row" style="margin-top:14px">
      <span>点击屏幕任意处退出聚光灯</span>
      <label class="switch"><input id="clickExit" type="checkbox" checked><span class="track"></span></label>
    </div>
    <div class="toggle-row">
      <span>多屏覆盖（黑幕横跨所有显示器，光圈跨屏跟随）</span>
      <label class="switch"><input id="allScreens" type="checkbox" checked><span class="track"></span></label>
    </div>
  </div>

  <div class="card">
    <h2>实时预览</h2>
    <div id="preview">
      <div class="scene">
        <div class="fake-title"></div>
        <div class="fake-line"></div>
        <div class="fake-line short"></div>
        <div class="fake-line"></div>
        <div class="fake-block"></div>
      </div>
      <div class="p-spot" id="pSpot"></div>
      <div class="p-tip">移动鼠标预览效果</div>
    </div>
  </div>

  <div class="card">
    <h2>显示器诊断</h2>
    <p class="hint" id="displayInfo" style="word-break: break-all;">读取中…</p>
  </div>

  <footer>
    所有设置自动保存并即时生效<br>
    在 ZTools 搜索框输入「聚光灯」或绑定全局快捷键开启
  </footer>
</div>

<div id="toast">已保存</div>

<script src="app.js"></script>
</body>
</html>
