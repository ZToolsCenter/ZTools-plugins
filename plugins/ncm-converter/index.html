<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>音频转 MP3</title>
</head>
<body style="font-family:sans-serif;padding:24px;color:#333">
  <h3>音频转 MP3</h3>
  <p>这是一个无界面插件。用法：</p>
  <ul>
    <li><b>超级面板</b>：中键选中一个音频文件 → 长按悬浮球 → 在面板里点「音频转 MP3」。</li>
    <li><b>搜索框</b>：输入 <code>转mp3</code> / <code>tomp3</code> / <code>ncm</code> → 选择「选择音频文件并转换为 MP3」→ 在弹出的窗口里选文件。</li>
  </ul>
  <p>转换后的 MP3 会生成在原文件同目录下（无封面）。</p>
  <p>转换完成时右下角会弹出结果提示窗，并播放提示音。</p>
</body>
</html>
