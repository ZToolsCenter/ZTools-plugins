<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>NCM 转换</title>
</head>
<body style="font-family:sans-serif;padding:24px;color:#333">
  <h3>NCM 转换</h3>
  <p>这是一个无界面插件。用法：</p>
  <ul>
    <li><b>超级面板</b>：中键选中一个 .ncm 文件 → 长按悬浮球 → 在面板里点「NCM 转换」。</li>
    <li><b>搜索框</b>：输入 <code>ncm</code> → 选择「选择 NCM 文件并转换」→ 在弹出的窗口里选文件。</li>
  </ul>
  <p>解密后的 MP3/FLAC 会生成在原文件同目录下。</p>
</body>
</html>
