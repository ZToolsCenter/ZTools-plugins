<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook 实验室</title><link rel="stylesheet" href="./style.css"></head><body><main><header><span class="pulse"></span><div><small>本地事件收件箱</small><h1>Webhook 实验室</h1></div><button id="start">启动监听</button><button id="stop">停止监听</button></header><section class="endpoint"><code id="url">监听器已停止</code><p>仅监听本机回环地址（127.0.0.1）；v0.1 不支持局域网绑定。</p><button id="copy-url">复制 URL</button><button id="copy-curl">复制 curl 命令</button></section><section><h2>请求记录</h2><div id="events" class="events" aria-live="polite"><article>正在等待携带签名的请求…</article></div></section><section class="sign"><h2>HMAC 签名试算</h2><input id="secret" type="password" autocomplete="off" spellcheck="false" placeholder="输入密钥"><textarea id="payload" placeholder="输入请求负载"></textarea><button id="sign">生成 SHA-256 签名</button><output id="digest"></output></section></main><script src="./app.js"></script></body></html>
