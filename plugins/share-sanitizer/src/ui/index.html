<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分享前脱敏</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><p class="eyebrow">本地脱敏工作台</p><h1>分享前脱敏</h1></div><div id="status" role="status">就绪</div></header><section class="grid"><div class="panel source"><label for="input">待分享内容</label><textarea id="input" maxlength="1048576" placeholder="粘贴分享前需要检查的文本…"></textarea><div class="controls"><button id="scan">扫描内容</button><button id="redact" class="danger">应用脱敏</button><button id="copy" class="secondary">复制安全文本</button></div><label class="file">载入图片 <input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><p id="ocr" class="hint"></p></div><aside class="panel findings"><h2>风险清单</h2><div id="summary">尚未发现风险。</div><ol id="findings"></ol><label for="whitelist">允许保留的值（每行一个）</label><textarea id="whitelist" rows="4" maxlength="20000" placeholder="例如：example@company.com"></textarea></aside></section><section id="imageDesk" class="panel image-desk" hidden><h2>图片脱敏画布</h2><p>在图片上拖动即可添加永久遮罩。导出时会重新编码像素并移除元数据。</p><canvas id="canvas"></canvas><div class="controls"><button id="exportImage">导出重新编码的图片</button><button id="clearMasks" class="secondary">清除遮罩</button></div></section></main><script type="module" src="./app.mjs"></script></body></html>
