<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Petdex 桌宠窗口</title>
    <style>
      :root {
        color-scheme: dark light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      #pet-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        image-rendering: pixelated;
      }

      #pet-canvas.dragging {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas" aria-label="桌面宠物"></canvas>
    <script src="pet.js"></script>
  </body>
</html>
