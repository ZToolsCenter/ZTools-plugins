<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="./lib/tailwind.min.js"></script>
    <script src="./lib/vue.global.js"></script>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f9fafb; user-select: none; }
        .card:hover { border-color: #3b82f6; background: #eff6ff; transform: translateY(-1px); }
        .glass-modal { backdrop-filter: blur(8px); background-color: rgba(0, 0, 0, 0.4); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    </style>
</head>
<body class="p-3">
    <div id="app">
        <div class="flex gap-2 mb-3 sticky top-0 bg-[#f9fafb]/80 backdrop-blur-sm z-10">
            <input v-model="search" placeholder="搜索关键词或简拼..." 
                   class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white">
            <button @click="showAddModal = true" class="bg-blue-500 text-white w-9 h-9 rounded-lg flex items-center justify-center hover:bg-blue-600 shadow-lg shadow-blue-200 transition-all active:scale-95">
                <span class="text-2xl leading-none">+</span>
            </button>
        </div>

        <div class="flex gap-2 mb-3 overflow-x-auto pb-1 no-scrollbar">
            <span v-for="g in groups" :key="g" @click="tab = g"
                  :class="['px-3 py-1 rounded-full text-xs cursor-pointer whitespace-nowrap transition-all', 
                           tab === g ? 'bg-blue-500 text-white shadow-md' : 'bg-white border text-gray-600 hover:bg-gray-50']">
                {{ g }}
            </span>
        </div>

        <div class="grid gap-2 overflow-y-auto" style="max-height: calc(100vh - 140px);">
            <div v-for="item in filteredList" :key="item.title" @click="handleClick(item)"
                 class="card border bg-white p-3 rounded-xl cursor-pointer transition-all shadow-sm relative group">
                <div class="flex justify-between items-start mb-1">
                    <span class="font-bold text-sm text-gray-800">{{ item.title }}</span>
                    <span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-400 uppercase tracking-tighter">{{ item.shortcut }}</span>
                </div>
                <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">{{ item.content }}</p>
                <div v-if="item.image" class="mt-2 text-[10px] text-blue-500 flex items-center gap-1 font-medium">
                    <span>🖼️</span> 附带图片素材
                </div>
            </div>
        </div>

        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
            <div class="flex items-center gap-3">
                <button @click="openExcel" class="text-[11px] text-gray-400 hover:text-blue-500 transition-colors">📝 批量管理</button>
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" v-model="autoSend" class="rounded text-blue-500">
                    <span class="text-[11px] text-gray-500">自动发送</span>
                </label>
            </div>
            <span class="text-[9px] text-gray-300 font-mono">v1.0.3</span>
        </div>

        <div v-if="showModal" class="fixed inset-0 glass-modal flex items-center justify-center z-[9999] p-4">
            <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-xs animate-in fade-in zoom-in duration-200">
                <h3 class="font-bold text-gray-800 mb-5 flex items-center gap-2">✍️ 补充变量</h3>
                <div class="space-y-4">
                    <div v-for="p in placeholders" :key="p.key">
                        <label class="text-[10px] font-bold text-gray-400 ml-1 uppercase">{{ p.key }}</label>
                        <input v-model="p.value" class="w-full border-b py-2 px-1 outline-none focus:border-blue-500 text-sm" @keyup.enter="handleConfirm" autofocus>
                    </div>
                </div>
                <div class="flex gap-3 mt-8">
                    <button @click="showModal = false" class="flex-1 py-2 text-sm text-gray-400">取消</button>
                    <button @click="handleConfirm" class="flex-1 py-2 bg-blue-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-100">发送</button>
                </div>
            </div>
        </div>

        <div v-if="showAddModal" class="fixed inset-0 glass-modal flex items-center justify-center z-[9999] p-4">
            <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm">
                <h3 class="font-bold text-gray-800 mb-5">➕ 新增快捷话术</h3>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input v-model="newItem.group" placeholder="分类(如:售后)" class="border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-400">
                        <input v-model="newItem.shortcut" placeholder="简拼(如:ckd)" class="border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-400">
                    </div>
                    <input v-model="newItem.title" placeholder="标题" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-400">
                    <textarea v-model="newItem.content" placeholder="话术内容 (支持 {{{变量}}})" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-400 h-24"></textarea>
                    
                    <div class="flex items-center gap-2">
                        <button @click="selectImg" class="text-xs bg-gray-100 px-3 py-2 rounded-lg hover:bg-gray-200 text-gray-600">🖼️ {{ newItem.image ? '更换图片' : '选择配图' }}</button>
                        <span v-if="newItem.image" class="text-[10px] text-gray-400 truncate flex-1">{{ newItem.image.split('\\').pop() }}</span>
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button @click="showAddModal = false" class="flex-1 py-2 text-sm text-gray-400">取消</button>
                    <button @click="addNewItem" class="flex-1 py-2 bg-green-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-green-100">保存到库</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const list = ref([]);
                const search = ref('');
                const tab = ref('全部');
                const autoSend = ref(true);
                const showModal = ref(false);
                const showAddModal = ref(false);
                const currentItem = ref(null);
                const placeholders = ref([]);
                const newItem = ref({ group: '', title: '', content: '', shortcut: '', image: '' });

                const loadData = () => { list.value = window.services.readCsv(); };
                const groups = computed(() => ['全部', ...new Set(list.value.map(i => i.group))]);
                const filteredList = computed(() => {
                    return list.value.filter(i => {
                        const s = search.value.toLowerCase();
                        return (tab.value === '全部' || i.group === tab.value) && (i.title.toLowerCase().includes(s) || i.shortcut.toLowerCase().includes(s));
                    });
                });

                const handleClick = (item) => {
                    currentItem.value = item;
                    const matches = item.content.match(/{{{(.*?)}}}/g);
                    if (matches) {
                        placeholders.value = matches.map(m => ({ key: m.replace(/{{{|}}}/g, ''), value: '' }));
                        showModal.value = true;
                    } else {
                        window.services.executePaste(item.content, item.image, autoSend.value);
                    }
                };

                const handleConfirm = () => {
                    let text = currentItem.value.content;
                    placeholders.value.forEach(p => {
                        const regex = new RegExp(`\\{\\{\\{${p.key}\\}\\}\\}`, 'g');
                        text = text.replace(regex, p.value || '');
                    });
                    window.services.executePaste(text, currentItem.value.image, autoSend.value);
                    showModal.value = false;
                };

                const selectImg = () => {
                    const path = window.services.selectImageFile();
                    if (path) newItem.value.image = path;
                };

                const addNewItem = () => {
                    if (!newItem.value.title || !newItem.value.content) return alert('请填入标题和内容');
                    window.services.appendCsv(newItem.value);
                    showAddModal.value = false;
                    newItem.value = { group: '', title: '', content: '', shortcut: '', image: '' };
                    loadData();
                };

                const openExcel = () => window.services.openInExcel();
                onMounted(loadData);

                return { list, search, tab, groups, filteredList, autoSend, showModal, showAddModal, placeholders, newItem, handleClick, handleConfirm, addNewItem, selectImg, openExcel };
            }
        }).mount('#app');
    </script>
</body>
</html>
