<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件解锁器 - Ztools</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-info">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <h1 class="brand-title">文件解锁器</h1>
        <span class="badge" id="fileCountBadge">未添加文件</span>
      </div>
      <div class="keyboard-tips">
        <span><span class="kbd">拖入</span> 文件/文件夹</span>
        <span><span class="kbd">右键</span> 进程菜单</span>
        <span><span class="kbd">Esc</span> 取消</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="controls-row">
      <button type="button" class="btn btn-primary" id="btnAdd">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        添加文件/文件夹
      </button>
      <button type="button" class="btn btn-secondary" id="btnSyncSelected" title="自动读取当前桌面或资源管理器中选中的文件/文件夹">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        获取当前选中项
      </button>
      <button type="button" class="btn btn-secondary" id="btnRefreshAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        刷新状态
      </button>
      <div class="spacer"></div>
      <button type="button" class="btn btn-batch" id="btnUnlockAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        全部解锁
      </button>
      <button type="button" class="btn btn-danger" id="btnDeleteAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        全部删除
      </button>
    </div>
  </header>

  <!-- File list -->
  <main class="file-panel">
    <div class="panel-header">
      <span class="panel-title">已添加文件 / 文件夹</span>
      <span class="panel-hint">点击行查看占用进程</span>
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-state" id="fileEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
          <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
        </svg>
        <span>拖入文件或文件夹，或点击「添加文件/文件夹」</span>
      </div>
    </div>
  </main>

  <!-- Holder panel -->
  <section class="holder-panel" id="holderPanel">
    <div class="panel-header">
      <span class="panel-title">占用进程</span>
      <span class="panel-hint" id="holderHint">选择文件后显示占用程序</span>
    </div>
    <div class="holder-table-header">
      <div class="hcol-name">进程名称</div>
      <div class="hcol-pid">PID</div>
      <div class="hcol-status">状态</div>
    </div>
    <div class="holder-list" id="holderList">
      <div class="holder-empty" id="holderEmpty">选择上方文件以查看占用程序</div>
    </div>
  </section>

  <!-- Selected file action bar -->
  <footer class="action-bar" id="actionBar" style="display:none;">
    <div class="action-file" id="actionFileLabel">-</div>
    <div class="action-buttons">
      <button type="button" class="btn btn-secondary" id="btnRefreshSel">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        刷新
      </button>
      <button type="button" class="btn btn-secondary" id="btnLocate">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        定位
      </button>
      <button type="button" class="btn btn-primary" id="btnUnlock">解锁</button>
      <button type="button" class="btn btn-warning" id="btnUnlockRename">解锁并重命名</button>
      <button type="button" class="btn btn-warning" id="btnUnlockMove">解锁并移动</button>
      <button type="button" class="btn btn-danger" id="btnUnlockDelete">解锁并删除</button>
    </div>
  </footer>

  <!-- Drag drop overlay -->
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
      </svg>
      <span id="dropText">松开以添加文件 / 文件夹</span>
    </div>
  </div>

  <!-- Context menu -->
  <div class="context-menu" id="contextMenu" style="display:none;">
    <div class="ctx-item" data-act="view"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>查看进程详情</div>
    <div class="ctx-item" data-act="open"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>打开程序位置</div>
    <div class="ctx-item" data-act="close-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>仅关闭句柄（无损解锁）</div>
    <div class="ctx-divider"></div>
    <div class="ctx-item ctx-danger" data-act="kill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>强制结束进程</div>
  </div>

  <!-- Process Detail Modal -->
  <div class="modal-overlay" id="processDetailModal">
    <div class="modal-box">
      <div class="modal-title">进程占用详情</div>
      <div class="modal-body" id="processDetailBody" style="font-size:12px;line-height:1.6;"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnDetailClose">关闭 (Esc)</button>
        <button type="button" class="btn btn-soft" id="btnDetailOpenExe">打开程序位置</button>
        <button type="button" class="btn btn-danger" id="btnDetailKill">强制结束进程</button>
      </div>
    </div>
  </div>

  <!-- Rename modal -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal-box small">
      <div class="modal-title">解锁并重命名</div>
      <div class="modal-subtitle" id="renameCur">-</div>
      <input type="text" id="renameInput" class="text-input" placeholder="请输入新的文件名（含扩展名）" spellcheck="false">
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnRenameCancel">取消 (Esc)</button>
        <button type="button" class="btn btn-primary" id="btnRenameOk">重命名 (Enter)</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box small">
      <div class="modal-title" id="confirmTitle">确认操作</div>
      <div class="modal-body" id="confirmBody">-</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnConfirmCancel">取消 (Esc)</button>
        <button type="button" class="btn btn-danger" id="btnConfirmOk">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
