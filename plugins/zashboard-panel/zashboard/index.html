    <script>
      ;(function () {
        'use strict';

        /* ===== CSS ===== */
        var style = document.createElement('style');
        style.textContent =

          '#sc-crash-content.open{transform:translateX(0)}' +

          '#sc-card-head{display:inline-flex;align-items:center;gap:0.5rem;padding:0.1rem 0;margin:0 0 0.25rem;border-radius:0.5rem;cursor:pointer;transition:background 0.15s, padding 0.15s, margin 0.15s;align-self:flex-start;max-width:fit-content}' +
          '#sc-card-head:hover{background:var(--color-base-200,#f3f4f6);padding-left:0.4rem;padding-right:0.4rem;margin-left:-0.4rem}' +
          '#sc-card-head.sc-no-hover{cursor:default!important;transition:none!important;background:transparent!important;padding:0.1rem!important;margin-left:0!important}' +
          '#sc-card-head.sc-no-hover:hover{background:transparent!important;padding:0.1rem!important;margin-left:0!important}' +
          '#sc-card-head svg{flex:none;color:var(--color-base-content,#1d1d1f)}' +
          '#sc-card-head .sc-head-title{font-size:1.125rem;font-weight:400;color:var(--color-base-content,#1d1d1f);white-space:nowrap;line-height:1.5}' +
          /* 弹窗模式下底部按钮与原生取消/保存一致（daisyUI btn class 原生样式） */
          '.sc-modal-crash .sc-card-foot{display:flex;justify-content:flex-end;gap:0.5rem;margin-top:auto!important;padding:0}' +
          /* 表单区域：与配置页一致 gap-2 (0.5rem) */
          '.sc-field{display:flex;flex-direction:column;gap:0.25rem}' +
          '.sc-field label{font-size:0.875rem;font-weight:400}' +
          '.sc-row{display:flex;gap:0.5rem;align-items:flex-start}' +
          '.sc-row .sc-field{flex:1;min-width:0}' +
          '.sc-row .sc-field.sc-proto{flex:0 0 5rem}' +
          '.sc-row .sc-field.sc-port{flex:0 0 5rem}' +
          /* 状态框 */
          '.sc-status-box{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.7rem;border-radius:0.5rem;font-size:0.75rem;min-height:2rem}' +
          '.sc-status-box.testing{background:rgba(107,114,128,0.1);color:#6b7280}' +
          '.sc-status-box.ok{background:rgba(22,163,74,0.1);color:#16a34a}' +
          '.sc-status-box.warning{background:rgba(245,158,11,0.1);color:#f59e0b}' +
          '.sc-status-box.fail{background:rgba(220,38,38,0.1);color:#dc2626}' +
          '.sc-status-box .dot{width:7px;height:7px;border-radius:50%;flex:none}' +
          '.sc-status-box.testing .dot{background:#6b7280;animation:sc-pulse 1s infinite}' +
          '.sc-status-box.ok .dot{background:#16a34a}' +
          '.sc-status-box.warning .dot{background:#f59e0b}' +
          '.sc-status-box.fail .dot{background:#dc2626}' +
          '.sc-retry-btn{display:none;margin-left:auto;background:transparent;border:none;font-size:0.75rem;cursor:pointer;padding:0.25rem 0.5rem;border-radius:0.25rem;color:inherit;white-space:nowrap;flex:none;transition:background 0.15s,color 0.15s}' +
          '.sc-status-box.fail .sc-retry-btn,.sc-status-box.warning .sc-retry-btn{display:inline-block}' +
          '.sc-status-box.fail .sc-retry-btn:hover{background:#dc2626;color:#fff}' +
          '[data-theme="dark"] .sc-status-box.fail .sc-retry-btn:hover,[data-theme*="dark"] .sc-status-box.fail .sc-retry-btn:hover{background:#C33F45;color:#fff}' +
          /* 底部按钮：无横线 */
          '.sc-card-foot{display:flex;gap:0.5rem;padding:0.25rem 0 0;margin-top:auto}' +
          '#sc-crash-content:not(.sc-modal-crash) .sc-card-foot button{flex:1;padding:0.5rem;border-radius:0.5rem;font-size:0.875rem;cursor:pointer;border:1px solid var(--color-base-300,#d1d5db)}' +
          '.sc-btn-close{background:var(--color-base-100,#fff);color:var(--color-base-content,#1d1d1f)}' +
          '.sc-btn-close:hover{background:var(--color-base-200,#f3f4f6)}' +
          '.sc-btn-enable{background:var(--color-primary,#3b82f6);color:var(--color-primary-content,#fff);border-color:transparent;font-weight:500}' +
          '.sc-btn-enable:disabled{background:var(--color-base-300,#d1d5db);color:var(--color-base-content,#9ca3af);cursor:not-allowed}' +
          '.sc-btn-enable:not(:disabled):hover{opacity:0.9}' +
          /* 侧边栏 BackendSwitch 菜单中的 ShellCrash 管理入口 */
          '.sc-sidebar-crash-btn{display:flex;align-items:center;gap:0.5rem;border-radius:0.375rem;padding:0.375rem 0.5rem;font-size:0.875rem;cursor:pointer;transition:background 0.15s;width:100%;text-align:left;background:transparent;border:none;color:inherit}' +
          '.sc-sidebar-crash-btn:hover{background:var(--color-base-200,#f3f4f6)}' +
          '.sc-sidebar-crash-btn svg{width:1rem;height:1rem;flex:none;opacity:0.6}' +
          '.sc-sidebar-crash-btn .sc-crash-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
          '.sc-sidebar-crash-btn .sc-crash-arrow{width:1rem;height:1rem;flex:none;opacity:0.5}' +
          /* ShellCrash 子菜单面板 */
          '.sc-crash-submenu{position:fixed;z-index:999;background:var(--color-base-100,#fff);border:1px solid var(--color-base-300,#d1d5db);border-radius:0.5rem;padding:0.25rem;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:0.125rem;min-width:10rem}' +
          '.sc-crash-submenu button{display:flex;align-items:center;gap:0.5rem;border-radius:0.375rem;padding:0.375rem 0.5rem;font-size:0.875rem;cursor:pointer;background:transparent;border:none;color:inherit;text-align:left;width:100%;transition:background 0.15s}' +
          '.sc-crash-submenu button:hover{background:var(--color-base-200,#f3f4f6)}' +
          '.sc-crash-submenu button .sc-crash-num{width:1.25rem;height:1.25rem;flex:none;display:flex;align-items:center;justify-content:center;font-size:0.75rem;opacity:0.7;border-radius:0.25rem;background:transparent}' +
          '@keyframes sc-pulse{0%,100%{opacity:1}50%{opacity:0.3}}';
        document.head.appendChild(style);

        /* ===== 工具 ===== */
        function getScConfig(key) {
          key = key || 'sc-ssh-config';
          try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
        }
        function saveScConfig(cfg, key) {
          key = key || 'sc-ssh-config';
          try { localStorage.setItem(key, JSON.stringify(cfg)); } catch (e) {}
        }

        /* 获取容器对应的配置 key（按 host 区分，SetupPage 用全局） */
        function getContainerConfigKey(container) {
          if (!container) return 'sc-ssh-config';
          if (container.classList && container.classList.contains('border-base-border')) return 'sc-ssh-config';
          var hostInput = getHostInput(container);
          var host = hostInput ? hostInput.value.trim() : '';
          if (host) return 'sc-ssh-config-' + host;
          return 'sc-ssh-config';
        }

        /* 判断容器模式：setup / create / edit */
        function getContainerMode(container) {
          if (!container) return 'setup';
          if (container.classList && container.classList.contains('border-base-border')) return 'setup';
          var modal = container.closest('[role="dialog"]') || container.closest('.modal');
          if (modal) {
            var titleEl = modal.querySelector('h3');
            if (!titleEl) {
              var all = modal.querySelectorAll('*');
              for (var i = 0; i < all.length; i++) {
                if (all[i].children.length === 0 && /添加后端|编辑后端/.test(all[i].textContent)) {
                  titleEl = all[i]; break;
                }
              }
            }
            if (titleEl) {
              if (titleEl.textContent.includes('添加')) return 'create';
              if (titleEl.textContent.includes('编辑')) return 'edit';
            }
          }
          return 'unknown';
        }

        function findSetupCard() {
          var hostInput = document.querySelector('input[placeholder="127.0.0.1"]');
          if (!hostInput) return null;
          return findContainerForInput(hostInput);
        }

        /* 通用：找到输入框所在的容器（SetupPage 卡片 或 BackendManager 弹窗内容） */
        function findContainerForInput(input) {
          // SetupPage 卡片
          var card = input.closest('.border-base-border');
          if (card) return card;
          // 弹窗内容容器：向上找包含 btn-primary 的 flex flex-col 容器
          var el = input;
          while (el && el.parentElement) {
            el = el.parentElement;
            if (el.classList && el.classList.contains('flex') && el.classList.contains('flex-col') && el.querySelector('button.btn-primary')) {
              return el;
            }
          }
          return null;
        }

        /* 找到所有包含 BackendForm 的容器 */
        function findAllFormContainers() {
          var inputs = document.querySelectorAll('input[placeholder="127.0.0.1"]');
          var containers = [];
          for (var i = 0; i < inputs.length; i++) {
            var c = findContainerForInput(inputs[i]);
            if (c && containers.indexOf(c) === -1) containers.push(c);
          }
          return containers;
        }

        function getHostInput(card) {
          var inputs = card.querySelectorAll('input');
          for (var i = 0; i < inputs.length; i++) {
            if (inputs[i].placeholder === '127.0.0.1') return inputs[i];
          }
          return null;
        }

        function getBackendForm(card) {
          var hostInput = getHostInput(card);
          if (!hostInput) return null;
          var el = hostInput;
          while (el && el.parentElement !== card) { el = el.parentElement; }
          return (el && el.parentElement === card) ? el : null;
        }

        /* ===== 状态 ===== */
        var hiddenElements = [];
        var testTimer = null;
        var testRunning = false;
        var testOk = false;
        var hostSyncHandler = null;
        var activeContainer = null;
        var modalTitleTextNode = null;
        var modalOriginalHTML = '';

        /* ===== 构建 SSH 内容 ===== */
        function buildCrashContent() {
          var content = document.createElement('div');
          content.id = 'sc-crash-content';
          content.innerHTML =
            '<div id="sc-card-head">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
              '<span class="sc-head-title">ShellCrash 管理</span>' +
            '</div>' +
            '<div class="sc-row">' +
              '<div class="sc-field sc-proto"><label>协议</label><input class="input input-sm w-full" value="SSH" readonly></div>' +
              '<div class="sc-field"><label>SSH 主机</label><input id="sc-p-host" class="input input-sm w-full" type="text" placeholder="127.0.0.1"></div>' +
              '<div class="sc-field sc-port"><label>端口</label><input id="sc-p-port" class="input input-sm w-full" type="text" placeholder="22"></div>' +
            '</div>' +
            '<div class="sc-field"><label>用户名</label><input id="sc-p-user" class="input input-sm w-full" type="text"></div>' +
            '<div class="sc-field"><label>密码</label><input id="sc-p-pass" class="input input-sm w-full" type="password"></div>' +
            '<div class="sc-field"><label>进入命令</label><input id="sc-p-cmd" class="input input-sm w-full" type="text"></div>' +
            '<div class="sc-status-box testing" id="sc-p-status"><span class="dot"></span><span id="sc-p-status-text">等待输入…</span><button class="sc-retry-btn" id="sc-p-retry">重试</button></div>' +
            '<div class="sc-card-foot">' +
              '<button class="sc-btn-close" id="sc-p-close">取消</button>' +
              '<button class="sc-btn-enable" id="sc-p-enable" disabled>开启</button>' +
            '</div>';

          content.querySelector('#sc-card-head').addEventListener('click', function () {
            // 仅弹窗模式下标题栏可点击返回，配置页只是纯文字标题
            if (content.classList.contains('sc-modal-crash')) {
              closeCrashPage('back');
            }
          });
          content.querySelector('#sc-p-close').addEventListener('click', function () { closeCrashPage('close'); });
          content.querySelector('#sc-p-retry').addEventListener('click', function () { runTest(); });
          content.querySelector('#sc-p-enable').addEventListener('click', function () {
            if (!testOk) return;
            var key = activeContainer ? getContainerConfigKey(activeContainer) : 'sc-ssh-config';
            var cfg = {
              enabled: true,
              host: content.querySelector('#sc-p-host').value.trim(),
              port: content.querySelector('#sc-p-port').value.trim() || '22',
              user: content.querySelector('#sc-p-user').value.trim() || 'root',
              pass: content.querySelector('#sc-p-pass').value,
              cmd: content.querySelector('#sc-p-cmd').value.trim() || 'crash'
            };
            saveScConfig(cfg, key);
            closeCrashPage('enable');
          });

          ['sc-p-host', 'sc-p-port', 'sc-p-user', 'sc-p-pass', 'sc-p-cmd'].forEach(function (id) {
            content.querySelector('#' + id).addEventListener('input', function () { scheduleTest(); });
          });

          return content;
        }

        function setStatus(state, text) {
          var content = document.getElementById('sc-crash-content');
          if (!content) return;
          var box = content.querySelector('#sc-p-status');
          box.className = 'sc-status-box ' + state;
          content.querySelector('#sc-p-status-text').textContent = text;
          testOk = (state === 'ok');
          content.querySelector('#sc-p-enable').disabled = !testOk;
        }

        function scheduleTest() {
          if (testTimer) clearTimeout(testTimer);
          testTimer = setTimeout(runTest, 600);
        }

        function translateSshError(msg) {
          if (!msg) return '连接失败';
          if (/All configured authentication methods failed/i.test(msg)) return '用户名或密码错误';
          if (/ECONNREFUSED/i.test(msg)) return '连接被拒绝，请检查 SSH 端口是否正确';
          if (/ETIMEDOUT|connect ETIMEDOUT/i.test(msg)) return '连接超时，请检查地址是否正确';
          if (/Timed out while waiting for handshake/i.test(msg)) return '连接超时，请检查网络';
          if (/ENOTFOUND|getaddrinfo/i.test(msg)) return '地址解析失败，请检查主机地址';
          if (/Connection lost|Connection reset/i.test(msg)) return '连接已断开';
          if (/No matching host key/i.test(msg)) return '主机密钥不匹配';
          return msg;
        }

        function runTest() {
          var content = document.getElementById('sc-crash-content');
          if (!content) return;
          var host = content.querySelector('#sc-p-host').value.trim();
          var port = content.querySelector('#sc-p-port').value.trim() || '22';
          var user = content.querySelector('#sc-p-user').value.trim() || 'root';
          var pass = content.querySelector('#sc-p-pass').value;
          var cmd = content.querySelector('#sc-p-cmd').value.trim() || 'crash';
          if (!host) { setStatus('fail', '请填写 SSH 主机地址'); return; }
          if (!window.services || !window.services.testSshAndCrash) {
            setStatus('fail', '需在 ZTools 中运行才能测试');
            return;
          }
          if (testRunning) return;
          testRunning = true;
          setStatus('testing', '正在连接 SSH…');
          window.services.testSshAndCrash({ host: host, port: port, user: user, pass: pass, cmd: cmd }).then(function (res) {
            testRunning = false;
            if (res && res.ok && res.status === 'running') {
              setStatus('ok', 'ShellCrash 服务运行中');
            } else if (res && res.ok && res.status === 'not_installed') {
              setStatus('warning', 'SSH 连接成功，ShellCrash未安装');
            } else if (res && res.ok && res.status === 'stopped') {
              setStatus('warning', 'ShellCrash 服务未运行');
            } else if (res && res.ok) {
              setStatus('ok', 'SSH 连接成功');
            } else {
              setStatus('fail', translateSshError(res && res.error));
            }
          }).catch(function (err) {
            testRunning = false;
            setStatus('fail', translateSshError(err && err.message ? err.message : String(err)));
          });
        }

        /* ===== 打开 SSH 页面 ===== */
        function openCrashPage(container) {
          var card = container || findSetupCard();
          if (!card) return;
          activeContainer = card;

          // 记录卡片当前高度，设置 min-height 防止切换时收缩（不固定 height，内容可扩展不被裁剪）
          var cardHeight = card.getBoundingClientRect().height;
          if (cardHeight > 50) {
            card.dataset.scOrigMinHeight = card.style.minHeight;
            card.style.minHeight = cardHeight + 'px';
          }

          // 保存并隐藏所有直接子元素
          hiddenElements = [];
          var children = card.children;
          for (var i = 0; i < children.length; i++) {
            hiddenElements.push(children[i]);
            children[i].style.display = 'none';
          }

          // 只隐藏水平溢出，防止滑入动画出现水平滚动条；垂直不限制避免内容裁剪
          card.dataset.scPrevOverflowX = card.style.overflowX;
          card.style.overflowX = 'hidden';

          var content = buildCrashContent();
          card.appendChild(content);

          // 弹窗模式：替换弹窗标题为"ShellCrash 管理"
          modalOriginalHTML = '';
          var modal = card.closest('[role="dialog"], .modal, .modal-box, [class*="dialog"], [class*="modal"]');
          if (!modal) {
            var el = card;
            while (el && el.parentElement) {
              el = el.parentElement;
              var pos = getComputedStyle(el).position;
              if (pos === 'fixed' || pos === 'absolute') { modal = el; break; }
            }
          }
          if (modal) {
            content.classList.add('sc-modal-crash');
            var head = content.querySelector('#sc-card-head');
            if (head) head.style.display = 'none';
            // 查找标题文本节点（标题文字是直接文本节点，旁边有关闭按钮）
            var titleTextNode = null;
            var all = modal.querySelectorAll('*');
            for (var ti = 0; ti < all.length; ti++) {
              var el = all[ti];
              for (var ni = 0; ni < el.childNodes.length; ni++) {
                var node = el.childNodes[ni];
                if (node.nodeType === 3) {
                  var txt = node.textContent.trim();
                  if (txt === '添加后端' || txt === '编辑后端' || txt === '修改后端配置') {
                    titleTextNode = node;
                    break;
                  }
                }
              }
              if (titleTextNode) break;
            }
            if (titleTextNode) {
              modalTitleTextNode = titleTextNode;
              modalOriginalHTML = titleTextNode.textContent;
              titleTextNode.textContent = 'ShellCrash 管理';
            }
            // 弹窗按钮使用 daisyUI 原生样式，与取消/保存一致
            var closeBtn = content.querySelector('#sc-p-close');
            var enableBtn = content.querySelector('#sc-p-enable');
            if (closeBtn) closeBtn.className = 'btn btn-sm';
            if (enableBtn) enableBtn.className = 'btn btn-primary btn-sm';
          } else {
            // 配置页：标题栏只保留文字，去掉 SVG 图标、点击返回和 hover 背景
            var setupHead = content.querySelector('#sc-card-head');
            if (setupHead) {
              var svgEl = setupHead.querySelector('svg');
              if (svgEl) svgEl.remove();
              setupHead.classList.add('sc-no-hover');
              setupHead.style.cursor = 'default';
            }
          }

          var hostInput = getHostInput(card);
          var mode = getContainerMode(card);
          var key = getContainerConfigKey(card);
          var saved = getScConfig(key);
          var hostEl = content.querySelector('#sc-p-host');

          if (mode === 'setup' || mode === 'create' || !saved) {
            // 配置页/创建模式/无保存配置：只继承主机地址，其他用默认值
            hostEl.value = hostInput ? hostInput.value.trim() : '';
            content.querySelector('#sc-p-port').value = '22';
            content.querySelector('#sc-p-user').value = '';
            content.querySelector('#sc-p-pass').value = '';
            content.querySelector('#sc-p-cmd').value = 'crash';
          } else {
            // 编辑模式有保存配置：从配置读取，主机地址优先用表单值
            hostEl.value = (hostInput ? hostInput.value.trim() : '') || (saved && saved.host) || '';
            content.querySelector('#sc-p-port').value = (saved && saved.port) || '22';
            content.querySelector('#sc-p-user').value = (saved && saved.user) || '';
            content.querySelector('#sc-p-pass').value = (saved && saved.pass) || '';
            content.querySelector('#sc-p-cmd').value = (saved && saved.cmd) || 'crash';
          }
          testOk = false;
          setStatus('testing', '正在连接 SSH…');
          content.querySelector('#sc-p-enable').disabled = true;

          if (hostInput) {
            hostSyncHandler = function () {
              hostEl.value = hostInput.value.trim();
              scheduleTest();
            };
            hostInput.addEventListener('input', hostSyncHandler);
          }

          requestAnimationFrame(function () {
            content.classList.add('open');
          });

          // 所有模式进入后自动尝试连接
          setTimeout(runTest, 400);
        }

        /* ===== 关闭 SSH 页面 ===== */
        function closeCrashPage(action) {
          var content = document.getElementById('sc-crash-content');
          if (!content) return;
          var card = activeContainer;

          if (hostSyncHandler) {
            var hostInput = card ? getHostInput(card) : null;
            if (hostInput) hostInput.removeEventListener('input', hostSyncHandler);
            hostSyncHandler = null;
          }

          content.classList.remove('open');

          if (action === 'close') {
            var key = activeContainer ? getContainerConfigKey(activeContainer) : 'sc-ssh-config';
            var cfg = getScConfig(key) || {};
            cfg.enabled = false;
            saveScConfig(cfg, key);
          }

          setTimeout(function () {
            content.remove();
            // 恢复弹窗标题文字（只恢复文本节点，不影响关闭按钮）
            if (modalTitleTextNode && document.body.contains(modalTitleTextNode)) {
              modalTitleTextNode.textContent = modalOriginalHTML;
            }
            modalTitleTextNode = null;
            modalOriginalHTML = '';
            for (var i = 0; i < hiddenElements.length; i++) {
              hiddenElements[i].style.display = '';
            }
            hiddenElements = [];
            if (card) {
              if (card.dataset.scPrevOverflowX !== undefined) {
                card.style.overflowX = card.dataset.scPrevOverflowX;
                delete card.dataset.scPrevOverflowX;
              }
              if (card.dataset.scOrigMinHeight !== undefined) {
                card.style.minHeight = card.dataset.scOrigMinHeight;
                delete card.dataset.scOrigMinHeight;
              }
            }
            activeContainer = null;
            updateAllEntryStatus();
          }, 300);
        }

        /* ===== 入口状态更新（所有容器独立配置） ===== */
        function updateAllEntryStatus() {
          var entries = document.querySelectorAll('.sc-crash-entry');
          for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            var container = entry.parentElement;
            var mode = getContainerMode(container);
            var key = getContainerConfigKey(container);
            var cfg = getScConfig(key);
            var on = !!(cfg && cfg.enabled);
            // 创建模式默认关闭（新后端还没保存过配置）
            if (mode === 'create' && !cfg) on = false;
            // 配置页每次都相当于重新添加，默认关闭，不看保存配置
            if (mode === 'setup') on = false;
            var toggle = entry.querySelector('.sc-crash-toggle');
            if (toggle) toggle.checked = on;
            var statusEl = entry.querySelector('.sc-entry-status');
            if (statusEl) {
              statusEl.textContent = on ? '已启用' : '未启用';
              statusEl.className = 'sc-entry-status ' + (on ? 'on' : 'off');
            }
          }
        }

        /* ===== 通用注入 ShellCrash 入口 ===== */
        function injectCrashEntry(container) {
          if (!container) return false;
          if (container.querySelector('.sc-crash-entry')) return true;

          var formDiv = getBackendForm(container);
          if (!formDiv) return false;

          var entry = document.createElement('div');
          entry.className = 'sc-crash-entry';
          entry.innerHTML =
            '<div class="sc-entry-left">' +
              '<span class="sc-entry-title">ShellCrash 管理</span>' +
              '<div class="tooltip" data-tip="通过 SSH 指令管理 Shellcrash，\n若无相关知识，谨慎开启">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.55;cursor:help"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
              '</div>' +
              '<span class="sc-entry-status off">未启用</span>' +
            '</div>' +
            '<input type="checkbox" class="sc-crash-toggle toggle toggle-sm">';

          var toggle = entry.querySelector('.sc-crash-toggle');
          toggle.addEventListener('change', function () {
            var key = getContainerConfigKey(container);
            if (toggle.checked) {
              openCrashPage(container);
            } else {
              var cfg = getScConfig(key) || {};
              cfg.enabled = false;
              saveScConfig(cfg, key);
              updateAllEntryStatus();
            }
          });

          formDiv.parentElement.insertBefore(entry, formDiv.nextSibling);
          // SetupPage 卡片加专属 class，用于状态栏/提交按钮的特殊 CSS
          if (container.classList && container.classList.contains('border-base-border')) {
            entry.classList.add('sc-setup-entry');
          }
          return true;
        }

        function injectSetupEntry() {
          // 清理残留的弹窗标题状态（弹窗被关闭或切换模式后）
          if (modalTitleTextNode) {
            if (!document.body.contains(modalTitleTextNode)) {
              modalTitleTextNode = null;
              modalOriginalHTML = '';
            }
          }
          var containers = findAllFormContainers();
          var injected = false;
          for (var i = 0; i < containers.length; i++) {
            if (injectCrashEntry(containers[i])) injected = true;
          }
          if (injected) {
            updateAllEntryStatus();
            fixCardHeight();
          }
          return injected;
        }

        /* ===== 锁定容器最大高度，防止状态栏行数变化导致抖动 ===== */
        function fixCardHeight() {
          if (document.getElementById('sc-crash-content')) return;
          var containers = findAllFormContainers();
          for (var i = 0; i < containers.length; i++) {
            var card = containers[i];
            var h = card.offsetHeight;
            var prev = parseFloat(card.dataset.scMaxHeight || '0');
            if (h > prev && h > 150) {
              card.dataset.scMaxHeight = h;
              card.style.minHeight = h + 'px';
            }
          }
        }

        function getCurrentSshConfig() {
          var host = getCurrentBackendHost();

          if (!cfg.host && host) cfg.host = host;

        function runCrashFunction(name, opts) {
          opts = opts || {};
          var host = getCurrentBackendHost();
          var cfg = getScConfig('sc-ssh-config-' + host) || getScConfig('sc-ssh-config') || {};
          if (!cfg.host && host) cfg.host = host;
          var indicator = opts.showIndicator ? showRunIndicator(name) : null;
          if (!cfg.host || !cfg.pass) {
            if (indicator && indicator.fail) indicator.fail('请先填写 SSH 信息');
            if (opts.onError) opts.onError('请先填写 SSH 信息');
            return Promise.resolve({ ok: false, error: '请先填写 SSH 信息' });
          }
          var outputEl = showSshDebugWindow('执行 · ' + name);
          outputEl.textContent = '正在连接 ' + cfg.host + ':' + (cfg.port || 22) + ' ...\n';
          if (!window.services) {
            if (indicator) indicator.fail('需在 ZTools 中运行');
            if (opts.onError) opts.onError('需在 ZTools 中运行');
            outputEl.textContent += '\n[错误] 需在 ZTools 中运行才能执行 SSH 指令\n';
            return Promise.resolve({ ok: false, error: '需在 ZTools 中运行' });
          }
          var onOutput = function (chunk) { appendSshOutput(chunk); };
          var onStep = function (idx, label) {
            if (indicator) indicator.setStep(label || ('步骤 ' + (idx + 1)));
          };
          var promise;
          if (name === '启动/重启服务' && window.services.restartService) {
            promise = window.services.restartService(cfg, onOutput, onStep);
          } else if (name === '停止服务' && window.services.stopService) {
            promise = window.services.stopService(cfg, onOutput, onStep);
          } else {
            var steps = getCrashSteps(name);
            if (steps.length === 0) {
              if (indicator) indicator.fail('该功能暂无指令步骤');
              if (opts.onError) opts.onError('该功能暂无指令步骤');
              outputEl.textContent += '\n[提示] 该功能暂无指令步骤\n';
              return Promise.resolve({ ok: false, error: '该功能暂无指令步骤' });
            }
            promise = window.services.runSteps(cfg, steps, onOutput);
          }
          return promise.then(function (res) {
            if (res && res.ok) {
              if (indicator) indicator.success('执行成功');
              if (opts.onSuccess) opts.onSuccess();
              appendSshOutput('\n[完成] 执行成功\n');
            } else {
              var err = res && res.error ? res.error : '未知错误';
              if (indicator) indicator.fail(err);
              if (opts.onError) opts.onError(err);
              appendSshOutput('\n[失败] ' + err + '\n');
            }
            return res;
          });
        }

        // 解析菜单输出，提取设置值
        function parseCrashSettings(menus) {
          var result = {
            routeMode: '',
            routeScope: '',
            containerHijack: '',
            dnsMode: '',
            dnsLeak: '',
            hostsOpt: '',
            ecsOpt: '',
            dnsPort: '',
            filterPorts: '',
            filterDevices: '',
            filterQuic: '',
            filterCnIp: '',
            ipv6Transparent: '',
            ipv6Dns: '',
            ipv6Enabled: '',
            skipCert: '',
            domainSniff: '',
            language: ''
          };
          // 清理 ANSI 转义字符和控制字符
          function clean(text) {
            if (!text) return '';
            return text
              .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
              .replace(/\x1b\[[0-9;]*[a-zA-Z]?/g, '')
              .replace(/\x1b[()][AB012]/g, '')
              .replace(/\x1b[>=]?/g, '')
              .replace(/\r/g, '')
              .replace(/\t/g, ' ')
              .replace(/[ ]+/g, ' ')
              .trim();
          }
          // 主菜单：解析4、5的状态，以及路由模式和DNS模式
          if (menus.main) {
            var main = clean(menus.main);
            // 按行解析，确保匹配到正确的行
            var lines = main.split('\n');
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              var skipMatch = line.match(/跳过.*证书验证[：:]\s*(ON|OFF)/i);
              if (skipMatch) {
                result.skipCert = skipMatch[1].toUpperCase();
              }
              var sniffMatch = line.match(/启用域名嗅探[：:]\s*(ON|OFF)/i);
              if (sniffMatch) {
                result.domainSniff = sniffMatch[1].toUpperCase();
              }
              // 从主菜单直接读取路由模式和DNS模式
              var routeMainMatch = line.match(/路由模式设置[：:]\s*([^\s|]+)/);
              if (routeMainMatch && !result.routeMode) {
                result.routeMode = routeMainMatch[1].trim();
              }
              var dnsMainMatch = line.match(/DNS设置[：:]\s*([^\s|]+)/i);
              if (dnsMainMatch && !result.dnsMode) {
                var dnsVal = dnsMainMatch[1].trim();
                // ShellCrash 中 redir 模式显示为 redir_host，映射为 redir
                if (dnsVal === 'redir_host') dnsVal = 'redir';
                result.dnsMode = dnsVal;
              }
            }
            if (main.match(/Please enter|Current|Select|Return/i) && !main.match(/请输入|当前|选择|返回/)) {
              result.isEnglish = true;
            }
          }
          // 路由模式（子菜单，作为补充）
          if (menus.route) {
            var route = clean(menus.route);
            var modeMatch = route.match(/当前路由模式为[：:]\s*([^；;\n|]+)/);
            if (modeMatch && !result.routeMode) result.routeMode = modeMatch[1].trim();
            var scopeMatch = route.match(/当前路由劫持范围[：:]\s*([^；;\n|]+)/);
            if (scopeMatch) result.routeScope = scopeMatch[1].trim();
            var containerMatch = route.match(/容器\/虚拟机劫持[：:]\s*(ON|OFF)/i);
            if (containerMatch) result.containerHijack = containerMatch[1].toUpperCase();
          }
          // DNS设置（子菜单，作为补充）
          if (menus.dns) {
            var dns = clean(menus.dns);
            var dnsModeMatch = dns.match(/当前DNS运行模式为[：:]\s*([^；;\n|]+)/i);
            if (dnsModeMatch && !result.dnsMode) {
              var dnsVal2 = dnsModeMatch[1].trim();
              if (dnsVal2 === 'redir_host') dnsVal2 = 'redir';
              result.dnsMode = dnsVal2;
            }
            var leakMatch = dns.match(/DNS防泄漏[：:]\s*(ON|OFF)/i);
            if (leakMatch) result.dnsLeak = leakMatch[1].toUpperCase();
            var hostsMatch = dns.match(/Hosts优化[：:]\s*(ON|OFF)/i);
            if (hostsMatch) result.hostsOpt = hostsMatch[1].toUpperCase();
            var ecsMatch = dns.match(/ECS优化[：:]\s*(ON|OFF)/i);
            if (ecsMatch) result.ecsOpt = ecsMatch[1].toUpperCase();
            var portMatch = dns.match(/DNS劫持端口[：:]\s*(\d+)/i);
            if (portMatch) result.dnsPort = portMatch[1];
          }
          // IPv6
          if (menus.ipv6) {
            var ipv6 = clean(menus.ipv6);
            var ip6tMatch = ipv6.match(/IPv6透明路由[^：:]*[：:]\s*(ON|OFF)/i);
            if (ip6tMatch) result.ipv6Transparent = ip6tMatch[1].toUpperCase();
            var ip6dMatch = ipv6.match(/IPv6-DNS解析[^：:]*[：:]\s*(ON|OFF)/i);
            if (ip6dMatch) result.ipv6Dns = ip6dMatch[1].toUpperCase();
          }
          return result;
        }

        function runBackupRestoreAction(action, cfg, backupBtn, restoreBtn) {
          if (!cfg || !cfg.host || !cfg.pass) {
            showToast('SSH 配置缺失', 'error');
            return;
          }
          if (!window.services || !window.services.runBackupRestore) {
            showToast('功能不可用', 'error');
            return;
          }
          var actionNames = { backup: '备份脚本设置', restore: '还原脚本设置' };
          var btns = [backupBtn, restoreBtn].filter(Boolean);
          btns.forEach(function (b) { b.disabled = true; });
          // 显示运行状态指示器和 SSH 调试窗口
          var indicator = showRunIndicator(actionNames[action]);
          var outputEl = showSshDebugWindow(actionNames[action]);
          outputEl.textContent = '正在连接 ' + cfg.host + ':' + (cfg.port || 22) + ' ...\n';
          var onOutput = function (chunk) { appendSshOutput(chunk); };
          var onStep = function (idx, label) {
            if (indicator) indicator.setStep(label || ('步骤 ' + idx));
          };
          window.services.runBackupRestore(cfg, action, onOutput, onStep).then(function () {
            if (indicator) indicator.success('操作成功');
            appendSshOutput('\n[完成] ' + actionNames[action] + '成功\n');
            showToast(actionNames[action] + '成功', 'success');
            btns.forEach(function (b) { b.disabled = false; });
          }).catch(function (err) {
            if (indicator) indicator.fail(err.message || '操作失败');
            appendSshOutput('\n[失败] ' + (err.message || err) + '\n');
            showToast(actionNames[action] + '失败: ' + (err.message || err), 'error');
            btns.forEach(function (b) { b.disabled = false; });
          });
        }

            content.className = 'min-h-0 overflow-y-auto p-4 flex flex-col gap-2';

            // 顶部操作栏：返回 | 标题区 | 编辑按钮
            var topBar = document.createElement('div');
            topBar.className = 'flex items-center justify-between -mt-1 -mx-1 mb-1';
            var backBtn = document.createElement('button');
            backBtn.className = 'btn btn-ghost btn-sm';
            backBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> 返回';
            backBtn.addEventListener('click', renderFuncList);
            var rightArea = document.createElement('div');
            rightArea.className = 'flex items-center gap-2';
            if (!editMode) {
              var editBtn = document.createElement('button');
              editBtn.className = 'btn btn-primary btn-sm';
              editBtn.textContent = '编辑';
              editBtn.addEventListener('click', function () { editMode = true; renderStepView(); });
              rightArea.appendChild(editBtn);
            }
            topBar.appendChild(backBtn);
            topBar.appendChild(rightArea);
            content.appendChild(topBar);

            // 步骤列表
            var stepsList = document.createElement('div');
            stepsList.className = 'flex flex-col gap-2';
            if (editMode) {
              renderStepsEditable(stepsList);
            } else {
              renderStepsReadonly(stepsList);
            }
            content.appendChild(stepsList);

            // 编辑模式底部操作区
            if (editMode) {
              var actionBar = document.createElement('div');
              actionBar.className = 'flex items-center justify-between mt-2 pt-2 border-t border-base-300';
              var leftGroup = document.createElement('div');
              leftGroup.className = 'flex gap-2';
              var addBtn = document.createElement('button');
              addBtn.className = 'btn btn-outline btn-sm';
              addBtn.textContent = '+ 添加步骤';
              addBtn.addEventListener('click', function () {
                editingSteps.push({ type: '输入数字', content: '', desc: '' });
                renderStepView();
              });
              var resetBtn = document.createElement('button');
              resetBtn.className = 'btn btn-ghost btn-sm';
              resetBtn.textContent = '恢复默认';
              resetBtn.addEventListener('click', function () {
                if (crashDefaultSteps[currentName]) {
                  editingSteps = JSON.parse(JSON.stringify(crashDefaultSteps[currentName]));
                } else {
                  editingSteps = [];
                }
                renderStepView();
              });
              leftGroup.appendChild(addBtn);
              leftGroup.appendChild(resetBtn);
              var rightGroup = document.createElement('div');
              rightGroup.className = 'flex gap-2';
              var cancelBtn = document.createElement('button');
              cancelBtn.className = 'btn btn-sm';
              cancelBtn.textContent = '取消';
              cancelBtn.addEventListener('click', function () {
                editMode = false;
                editingSteps = JSON.parse(JSON.stringify(getCrashSteps(currentName)));
                renderStepView();
              });
              var saveBtn = document.createElement('button');
              saveBtn.className = 'btn btn-primary btn-sm';
              saveBtn.textContent = '保存';
              saveBtn.addEventListener('click', function () {
                saveCrashSteps(currentName, editingSteps);
                editMode = false;
                renderStepView();
              });
              rightGroup.appendChild(cancelBtn);
              rightGroup.appendChild(saveBtn);
              actionBar.appendChild(leftGroup);
              actionBar.appendChild(rightGroup);
              content.appendChild(actionBar);
            }
          }

          // 只读模式
          function renderStepsReadonly(container) {
            if (editingSteps.length === 0) {
              var empty = document.createElement('div');
              empty.className = 'text-center py-6 text-base-content/40 text-sm';
              empty.textContent = '暂无步骤';
              container.appendChild(empty);
              return;
            }
            for (var i = 0; i < editingSteps.length; i++) {
              (function (idx) {
                var step = editingSteps[idx];
                var row = document.createElement('div');
                row.className = 'flex items-center gap-2 text-sm py-1.5';
                var num = document.createElement('span');
                num.className = 'text-base-content/40 w-5 text-center flex-shrink-0';
                num.textContent = (idx + 1);
                // 类型：独立badge框，背景色跟内容容器一致
                var type = document.createElement('span');
                type.className = 'badge badge-sm flex-shrink-0';
                type.style.backgroundColor = 'var(--sc-step-bg)';
                type.style.borderColor = 'transparent';
                type.textContent = step.type;
                // 内容+说明：独立背景框，高度圆角跟badge一致
                var contentWrap = document.createElement('div');
                contentWrap.className = 'flex items-center gap-2 rounded-md px-2 h-5 flex-1 min-w-0';
                contentWrap.style.backgroundColor = 'var(--sc-step-bg)';
                var val = document.createElement('span');
                val.className = 'font-mono text-sm text-base-content truncate flex-1';
                val.textContent = step.content || '(空)';
                contentWrap.appendChild(val);
                if (step.desc) {
                  var desc = document.createElement('span');
                  desc.className = 'text-sm text-base-content/50 flex-shrink-0';
                  desc.textContent = step.desc;
                  contentWrap.appendChild(desc);
                }
                row.appendChild(num);
                row.appendChild(type);
                row.appendChild(contentWrap);
                container.appendChild(row);
              })(i);
            }
          }

          // 编辑模式
          function renderStepsEditable(container) {
            for (var i = 0; i < editingSteps.length; i++) {
              (function (idx) {
                var row = document.createElement('div');
                row.className = 'flex items-center gap-2 rounded-lg px-2 py-2';
                row.style.backgroundColor = 'var(--sc-step-bg)';
                row.setAttribute('data-idx', idx);
                // 拖动手柄
                var dragHandle = document.createElement('span');
                dragHandle.className = 'cursor-grab text-base-content/40 text-base px-1 select-none flex-shrink-0 sc-drag-handle';
                dragHandle.innerHTML = '≡';
                row.appendChild(dragHandle);
                // 类型：select-sm，缩短框长
                var typeSelect = document.createElement('select');
                typeSelect.className = 'select select-sm select-bordered flex-shrink-0';
                typeSelect.style.width = 'auto';
                typeSelect.style.minWidth = '4rem';
                var types = ['输入指令', '输入数字', '输入文本', '等待输出'];
                for (var t = 0; t < types.length; t++) {
                  var opt = document.createElement('option');
                  opt.value = types[t];
                  opt.textContent = types[t];
                  if (editingSteps[idx].type === types[t]) opt.selected = true;
                  typeSelect.appendChild(opt);
                }
                typeSelect.addEventListener('change', function () { editingSteps[idx].type = typeSelect.value; });
                row.appendChild(typeSelect);
                // 内容
                var contentInput = document.createElement('input');
                contentInput.type = 'text';
                contentInput.value = editingSteps[idx].content;
                contentInput.placeholder = '指令内容';
                contentInput.className = 'input input-sm input-bordered flex-1 min-w-0';
                contentInput.addEventListener('change', function () { editingSteps[idx].content = contentInput.value; });
                row.appendChild(contentInput);
                // 说明
                var descInput = document.createElement('input');
                descInput.type = 'text';
                descInput.value = editingSteps[idx].desc || '';
                descInput.placeholder = '说明';
                descInput.className = 'input input-sm input-bordered w-24 flex-shrink-0';
                descInput.addEventListener('change', function () { editingSteps[idx].desc = descInput.value; });
                row.appendChild(descInput);
                // 删除
                var delBtn = document.createElement('button');
                delBtn.className = 'btn btn-ghost btn-sm btn-square text-error';
                delBtn.innerHTML = '✕';
                delBtn.addEventListener('click', function () {
                  editingSteps.splice(idx, 1);
                  renderStepView();
                });
                row.appendChild(delBtn);
                container.appendChild(row);
              })(i);
            }
            if (editingSteps.length === 0) {
              var empty = document.createElement('div');
              empty.className = 'text-center py-4 text-base-content/40 text-sm';
              empty.textContent = '暂无步骤，点击下方添加';
              container.appendChild(empty);
            }
            // 用 SortableJS 实现拖拽排序（跟后端管理一致）
            if (window.Sortable && editingSteps.length > 0) {
              Sortable.create(container, {
                handle: '.sc-drag-handle',
                animation: 150,
                ghostClass: 'opacity-50',
                chosenClass: 'bg-base-300',
                // 用透明图像作为拖拽预览，去掉跟随鼠标的淡影
                setData: function (dataTransfer) {
                  var img = new Image();
                  img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                  dataTransfer.setDragImage(img, 0, 0);
                },
                onEnd: function (evt) {
                  if (evt.oldIndex === evt.newIndex) return;
                  var moved = editingSteps.splice(evt.oldIndex, 1)[0];
                  editingSteps.splice(evt.newIndex, 0, moved);
                }
              });
            }
          }

          if (autoOpenName) {
            renderStepPage(autoOpenName);
          } else {
            renderFuncList();
          }
          } catch (e) { alert('编辑页错误: ' + e.message); }
        }


        function findBackendSwitchPanel() {
          var fixedEls = document.querySelectorAll('.fixed');
          for (var i = 0; i < fixedEls.length; i++) {
            var panel = fixedEls[i];
            if (!panel.classList.contains('flex') || !panel.classList.contains('flex-col')) continue;
            var btns = panel.querySelectorAll('button');
            for (var j = 0; j < btns.length; j++) {
              var txt = btns[j].textContent.trim();
              if (txt === '管理后端' || txt === '添加后端' || txt === '新增後端') return panel;
            }
          }
          return null;
        }

        function getCurrentBackendHost() {
          // 优先从 zashboard 的 localStorage 读取当前后端，更准确
          try {
            var activeUuid = localStorage.getItem('setup/active-uuid');
            if (activeUuid) {
              activeUuid = activeUuid.replace(/^"|"$/g, ''); // 去掉可能的引号
              var list = JSON.parse(localStorage.getItem('setup/api-list') || '[]');
              for (var i = 0; i < list.length; i++) {
                if (list[i].uuid === activeUuid && list[i].host) return list[i].host;
              }
            }
          } catch (e) {}
          // 兜底：从 DOM 中找当前选中的后端
          var panel = findBackendSwitchPanel();
          if (!panel) return null;
          var btns = panel.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            if (btns[i].classList.contains('bg-base-200')) {
              var text = btns[i].textContent.trim();
              var match = text.match(/(\d{1,3}\.){3}\d{1,3}/);
              if (match) return match[0];
            }
          }
          return null;
        }

        function isCrashEnabledForCurrentBackend() {
          var host = getCurrentBackendHost();
          if (!host) return false;
          var cfg = getScConfig('sc-ssh-config-' + host);
          return !!(cfg && cfg.enabled);
        }

          var left = rect.right + 4;
          var top = rect.top;
          if (left + menuRect.width > window.innerWidth - 8) left = rect.left - menuRect.width - 4;
          if (top + menuRect.height > window.innerHeight - 8) top = window.innerHeight - menuRect.height - 8;
          menu.style.left = left + 'px';
          menu.style.top = top + 'px';
          crashSubmenu = menu;
          // 鼠标移入子菜单：取消延迟关闭
          menu.addEventListener('mouseenter', function () {

          menu.addEventListener('mouseleave', function (e) {

          crashCloseHandler = function (e) {
            if (anchorBtn && anchorBtn.contains(e.target)) return;
            if (menu && menu.contains(e.target)) return;
            closeCrashSubmenu();
          };
          document.addEventListener('mousedown', crashCloseHandler, true);
        }

        /* ===== 连接失败全屏弹窗注入"启动shellcrash服务"按钮 ===== */
        function findFailModal() {
          var overlays = document.querySelectorAll('[class*="z-[100000]"]');
          for (var i = 0; i < overlays.length; i++) {
            var overlay = overlays[i];
            var title = overlay.querySelector('h1');
            if (!title) continue;
            var titleText = title.textContent.trim();
            if (titleText.indexOf('连接失败') === -1 && titleText.indexOf('Connection failed') === -1) continue;
            // 找到重试按钮和按钮区
            var btns = overlay.querySelectorAll('button');
            var retryBtn = null;
            var btnContainer = null;
            for (var j = 0; j < btns.length; j++) {
              var b = btns[j];
              var bt = b.textContent.trim();
              if (bt.indexOf('重试') !== -1 || bt.indexOf('Retry') !== -1 || bt.indexOf('正在连接') !== -1) {
                retryBtn = b;
                btnContainer = b.parentElement;
                break;
              }
            }
            if (!btnContainer) continue;
            // 提示框是按钮区的前一个兄弟元素
            var tipBox = btnContainer.previousElementSibling;
            return { overlay: overlay, btnContainer: btnContainer, retryBtn: retryBtn, tipBox: tipBox };
          }
          return null;
        }

        // Toast 提示
        var scToastEl = null;
        var scToastTimer = null;
        function showToast(msg, type, persistent) {
          // 新提示替代旧提示
          if (scToastEl && scToastEl.parentNode) {
            scToastEl.parentNode.removeChild(scToastEl);
          }
          if (scToastTimer) {
            clearTimeout(scToastTimer);
            scToastTimer = null;
          }
          var toast = document.createElement('div');
          toast.className = 'bg-base-100 shadow-lg';
          var colorStyle = '';
          if (type === 'success') {
            colorStyle = 'color:#16a34a;';
          } else if (type === 'error') {
            colorStyle = 'color:#dc2626;';
          }
          toast.style.cssText = 'padding:10px 20px;border-radius:8px;font-size:14px;pointer-events:auto;animation:sc-toast-in 0.3s ease;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999999;' + colorStyle;
          toast.textContent = msg;
          document.body.appendChild(toast);
          scToastEl = toast;
          // persistent 为 true 时不自动消失（如"正在启动"提示）
          if (!persistent) {
            scToastTimer = setTimeout(function () {
              toast.style.animation = 'sc-toast-out 0.3s ease forwards';
              setTimeout(function () {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
                if (scToastEl === toast) scToastEl = null;
              }, 300);
            }, 2500);
          }
          if (!document.getElementById('sc-toast-style')) {
            var style = document.createElement('style');
            style.id = 'sc-toast-style';
            style.textContent = '@keyframes sc-toast-in { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } } @keyframes sc-toast-out { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(-10px); } }';
            document.head.appendChild(style);
          }
        }

        function updateFailModalTip(msg, type) {
          var modal = findFailModal();
          if (!modal || !modal.tipBox) return;
          var tipBox = modal.tipBox;
          tipBox.textContent = msg;
          if (type === 'success') {
            tipBox.style.background = 'rgba(22, 163, 74, 0.1)';
            tipBox.style.color = '#16a34a';
          } else {
            tipBox.style.background = '';
            tipBox.style.color = '';
          }
        }

        function injectFailModalButton() {
          var modal = findFailModal();
          if (!modal) return;
          var btnContainer = modal.btnContainer;
          var retryBtn = modal.retryBtn;
          if (!retryBtn || !btnContainer) return;
          if (btnContainer.querySelector('.sc-start-crash-btn')) return;
          // 按钮容器允许换行
          btnContainer.style.flexWrap = 'wrap';
          // 修改后端配置按钮移到下一行
          var btns = btnContainer.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            var bt = btns[i].textContent.trim();
            if (bt.indexOf('修改后端配置') !== -1 || bt.indexOf('Edit backend') !== -1) {
              btns[i].style.flexBasis = '100%';
              break;
            }
          }
          // 创建启动按钮
          var startBtn = retryBtn.cloneNode(true);
          startBtn.className = retryBtn.className + ' sc-start-crash-btn';
          startBtn.textContent = '启动shellcrash服务';
          startBtn.disabled = false;
          startBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            e.preventDefault();
            if (startBtn.disabled) return;
            if (!isCrashEnabledForCurrentBackend()) {
              showToast('未启用 ShellCrash 管理功能', 'info');
              return;
            }
            startBtn.disabled = true;
            // 正在启动提示持续显示，等结果出来后替换
            showToast('正在启动 shellcrash 服务...', 'info', true);
            runCrashFunction('启动/重启服务').then(function (res) {
              if (res && res.ok) {
                showToast('shellcrash 服务启动成功', 'success');
              } else {
                var err = res && res.error ? res.error : '未知错误';
                showToast('启动失败: ' + err, 'error');
              }
              startBtn.disabled = false;
            });
          });
          btnContainer.insertBefore(startBtn, retryBtn.nextSibling);
        }

        /* ===== 启动注入 ===== */
        var moThrottle = 0;
        var mo = new MutationObserver(function () {
          var now = Date.now();
          if (now - moThrottle < 50) return;
          moThrottle = now;
          injectSetupEntry();
          fixCardHeight();
          injectSidebarCrashMenu();
          injectFailModalButton();
        });
        mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

        // 立即尝试注入，减少延迟
        injectSetupEntry();
        injectSidebarCrashMenu();
        injectFailModalButton();
        setTimeout(injectSetupEntry, 50);
        setTimeout(injectSidebarCrashMenu, 50);
        setTimeout(injectFailModalButton, 50);
        setTimeout(injectSetupEntry, 150);
        setTimeout(injectSidebarCrashMenu, 150);
        setTimeout(injectFailModalButton, 150);
        setTimeout(injectSetupEntry, 300);
        setTimeout(injectSidebarCrashMenu, 300);
        setTimeout(injectFailModalButton, 300);
        setTimeout(injectSetupEntry, 500);
        setTimeout(injectSidebarCrashMenu, 500);
        setTimeout(injectFailModalButton, 500);

        var timer = setInterval(function () { injectSetupEntry(); injectFailModalButton(); }, 500);
        setTimeout(function () { clearInterval(timer); }, 15000);
      })();
    </script>
  </body>
</html>
