[package]
name = "askills"
default-run = "askills"
version = "1.0.2"
description = "A local-first desktop manager for Agent Skills"
authors = ["Candquarzy"]
license = "MIT"
repository = "https://github.com/Candquarzy/Askills"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "askills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
tempfile = "3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
