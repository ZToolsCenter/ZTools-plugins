  <script>
    // ===== State =====
    const params = new URLSearchParams(location.search);
    const TOKEN = params.get('token') || '';
    const SCOPE_PATH = params.get('path') || '';
    // Dev/test switch: ?peer=1 forces this browser into the remote-client
    // (peer) flow even on the plugin machine, so the client experience can be
    // exercised from a local browser without a second device.
    const FORCE_PEER = params.get('peer') === '1';
    let fileTree = [];
    let currentFilePath = null;
    let currentFileExt = '';
    let currentViewMode = 'preview';
    let currentRawContent = '';
    let searchQuery = '';
    let searchTimer = null;
    let myIp = ''; // this client's IP as seen by the server
    let isLocalHost = false; // is the browser on the plugin machine?
    let hostLocalUrl = '';   // http://127.0.0.1:port/?token=...
    let hostLanUrl = '';     // http://<lan ip>:port/?token=...

    // ===== P2P private messaging state =====
    const p2p = {
      ready: false,
      peerKey: '',
      peerId: '',
      session: null,      // { id, status, peerName }
      messages: [],
      lastSeq: 0,
      es: null,
      pollTimer: null,
      pollSince: 0,
      unread: 0,
      drawing: false
    };

    // ===== Init =====
    function init() {
      loadTheme();
      document.getElementById('themeBtn').addEventListener('click', toggleTheme);
      document.getElementById('refreshBtn').addEventListener('click', function () { loadFileList(); showToast('列表已刷新'); });
      document.getElementById('localHintCopy').addEventListener('click', function () {
        if (hostLocalUrl) {
          copyToClipboard(hostLocalUrl).then(() => showToast('本机地址已复制')).catch(() => { });
        }
      });
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('modalTabs').addEventListener('click', function (e) {
        if (e.target.classList.contains('modal-tab')) {
          document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          currentViewMode = e.target.dataset.view;
          if (currentFilePath) renderPreview(currentRawContent, currentFileExt);
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (document.getElementById('imgViewer').style.display !== 'none') closeImgViewer();
          else if (document.getElementById('confirmOverlay').style.display !== 'none') closeDialog(null);
          else if (p2p.drawing || host.active) closeP2pEntry();
          else closeModal();
        }
      });
      initImgViewer();
      // Dialog wiring (overlay click closes like a cancel)
      document.getElementById('confirmOverlay').addEventListener('click', function (e) {
        if (e.target === this) closeDialog(null);
      });
      document.getElementById('selectAllCb').addEventListener('click', selectAllFiles);
      document.getElementById('dlSelectedBtn').addEventListener('click', downloadSelected);
      document.getElementById('dlAllBtn').addEventListener('click', downloadAllFiles);
      document.getElementById('modalCopyBtn').addEventListener('click', function () {
        if (currentRawContent) {
          copyToClipboard(currentRawContent).then(() => {
            const btn = document.getElementById('modalCopyBtn');
            btn.textContent = '已复制';
            showToast('内容已复制到剪贴板');
            setTimeout(() => { btn.textContent = '复制内容'; }, 2000);
          }).catch(() => { });
        }
      });

      // Search
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function () {
        searchQuery = this.value.trim().toLowerCase();
        document.getElementById('searchClear').style.display = searchQuery ? '' : 'none';
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(renderSections, 200);
      });
      document.getElementById('searchClear').addEventListener('click', function () {
        searchInput.value = '';
        searchQuery = '';
        this.style.display = 'none';
        renderSections();
      });

      // Upload (hidden in scoped views — scoped links are read-only)
      if (SCOPE_PATH) {
        document.getElementById('uploadBtn').style.display = 'none';
      }
      document.getElementById('uploadBtn').addEventListener('click', function () {
        document.getElementById('uploadInput').click();
      });
      document.getElementById('uploadInput').addEventListener('change', function () {
        if (this.files && this.files.length > 0) {
          uploadFiles(this.files);
          this.value = '';
        }
      });
      document.getElementById('uploadPanelClose').addEventListener('click', function () {
        document.getElementById('uploadPanel').classList.remove('show');
      });

      // Drag & drop upload
      let dragDepth = 0;
      document.addEventListener('dragenter', function (e) {
        e.preventDefault();
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
          dragDepth++;
          document.getElementById('dropOverlay').classList.add('show');
        }
      });
      document.addEventListener('dragover', function (e) { e.preventDefault(); });
      document.addEventListener('dragleave', function (e) {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) document.getElementById('dropOverlay').classList.remove('show');
      });
      document.addEventListener('drop', function (e) {
        e.preventDefault();
        dragDepth = 0;
        document.getElementById('dropOverlay').classList.remove('show');
        if (!SCOPE_PATH && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          uploadFiles(e.dataTransfer.files);
        }
      });

      // P2P / host wiring (mode-aware: remote = peer flow, local = message console)
      document.getElementById('p2pBtn').addEventListener('click', toggleP2pEntry);
      document.getElementById('p2pMask').addEventListener('click', closeP2pEntry);
      document.getElementById('p2pDrawerClose').addEventListener('click', closeP2pEntry);
      document.getElementById('p2pFileInput').addEventListener('change', onP2pFileInput);
      document.getElementById('hostLogsBtn').addEventListener('click', openHostLogs);
      document.getElementById('hostWhitelistBtn').addEventListener('click', openHostWhitelist);
      document.getElementById('sideTabFiles').addEventListener('click', () => setView('files'));
      document.getElementById('sideTabMessages').addEventListener('click', () => setView('messages'));
      document.getElementById('navP2pBtn').addEventListener('click', () => { if (hostUiMode()) setView('messages'); else openP2pDrawer(); });
      document.getElementById('navFilesBtn').addEventListener('click', () => { if (hostUiMode()) setView('files'); else closeP2pDrawer(); });

      loadFileList();
    }

    // ===== Theme =====
    function loadTheme() {
      const saved = localStorage.getItem('fs-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcon(saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fs-theme', next);
      updateThemeIcon(next);
      if (currentFilePath) renderPreview(currentRawContent, currentFileExt);
    }
    function updateThemeIcon(theme) {
      document.getElementById('sunIcon').style.display = theme === 'dark' ? 'none' : '';
      document.getElementById('moonIcon').style.display = theme === 'dark' ? '' : 'none';
    }

    // ===== File List =====
    async function loadFileList() {
      try {
        let apiUrl = '/api/list?token=' + TOKEN;
        if (SCOPE_PATH) apiUrl += '&path=' + encodeURIComponent(SCOPE_PATH);
        const res = await fetch(apiUrl);
        const data = await res.json();
        fileTree = data.files || [];
        myIp = data.clientIp || '';
        isLocalHost = !!data.isLocalHost;
        hostLocalUrl = data.hostLocalUrl || '';
        hostLanUrl = data.hostLanUrl || '';
        renderAccessInfo();
        initP2pMode();
        // If scoped, hide header title area (show scope path instead)
        if (data.scoped && data.scopePath) {
          document.querySelector('.header-left h1').textContent = decodeURIComponent(data.scopePath).split(/[/\\]/).filter(Boolean).pop() || 'FileShare';
        }
        renderSections();
        updateFileCount(fileTree);
      } catch (err) {
        document.getElementById('tree').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">加载文件列表失败</div>';
      }
    }
    function countFiles(items) {
      let c = 0;
      for (const item of items) {
        if (!item.isDirectory) c++;
        if (item.children) c += countFiles(item.children);
      }
      return c;
    }
    function updateFileCount(items) {
      document.getElementById('fileCount').textContent = countFiles(items) + ' 个文件';
    }

    // ===== Local / remote access pill =====
    function renderAccessInfo() {
      const pill = document.getElementById('accessPill');
      const hint = document.getElementById('localHint');
      // Already on the loopback address (127.0.0.1/localhost)? Then there is
      // nothing to "switch to" — drop the redundant recommendation.
      const hostname = (location.hostname || '').toLowerCase();
      const onLoopback = hostname === '127.0.0.1' || hostname === 'localhost' || hostname === '::1';
      if (isLocalHost) {
        pill.className = 'access-pill local';
        pill.innerHTML = '<span class="pill-dot"></span>本机访问';
        if (!onLoopback && hostLocalUrl) {
          // arrived via the LAN IP — recommend the stable localhost URL
          document.getElementById('localHintUrl').textContent = hostLocalUrl;
          hint.classList.add('show');
        } else {
          hint.classList.remove('show');
        }
      } else {
        pill.className = 'access-pill remote';
        pill.innerHTML = '<span class="pill-dot"></span>远程访问' + (myIp ? ' · ' + escHtml(myIp) : '');
        hint.classList.remove('show');
      }
      pill.style.display = '';
    }

    // ===== Section grouping: host shares vs per-IP client uploads =====
    function groupItems(items) {
      const host = [];
      const byIp = {};
      for (const item of items) {
        // Uploads made from the plugin machine itself (origin.local) belong to
        // the host section — they are not a remote client's upload.
        if (item.origin && item.origin.type === 'upload' && !item.origin.local) {
          const ip = item.origin.ip || '未知来源';
          if (!byIp[ip]) byIp[ip] = [];
          byIp[ip].push(item);
        } else {
          host.push(item);
        }
      }
      const uploadSections = Object.entries(byIp)
        .map(([ip, list]) => {
          list.sort((a, b) => ((b.origin && b.origin.time) || '').localeCompare((a.origin && a.origin.time) || ''));
          return { ip: ip, items: list };
        })
        .sort((a, b) => ((b.items[0].origin && b.items[0].origin.time) || '').localeCompare((a.items[0].origin && a.items[0].origin.time) || ''));
      return { host, uploadSections };
    }

    // ===== Search filter: keep items whose name matches or whose children match =====
    function filterTree(items, q) {
      if (!q) return items;
      const result = [];
      for (const item of items) {
        const nameMatch = (item.name || '').toLowerCase().includes(q);
        let children = null;
        if (item.children && item.children.length > 0) {
          children = filterTree(item.children, q);
        }
        if (nameMatch || (children && children.length > 0)) {
          const copy = { name: item.name, path: item.path, isDirectory: item.isDirectory };
          if (item.origin) copy.origin = item.origin;
          if (children && children.length > 0) copy.children = children;
          result.push(copy);
        }
      }
      return result;
    }

    function renderSections() {
      const treeEl = document.getElementById('tree');
      treeEl.innerHTML = '';

      const q = searchQuery.trim().toLowerCase();
      const { host, uploadSections } = groupItems(fileTree);
      const filteredHost = filterTree(host, q);
      const filteredUploads = uploadSections
        .map(s => ({ ip: s.ip, items: filterTree(s.items, q) }))
        .filter(s => s.items.length > 0);

      let anyRendered = false;

      // Host shares section
      if (filteredHost.length > 0) {
        const section = document.createElement('div');
        section.className = 'section';
        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = '<span class="section-label"><svg viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6.5l-1.5-2H5a2 2 0 00-2 2z"/></svg>主机共享</span>' +
          '<span class="section-count">' + countFiles(filteredHost) + ' 个文件</span>';
        section.appendChild(header);
        const rows = document.createElement('div');
        rows.className = 'section-rows';
        section.appendChild(rows);
        renderTree(filteredHost, rows, 0);
        treeEl.appendChild(section);
        anyRendered = true;
      }

      // Client upload sections, one per IP
      for (const s of filteredUploads) {
        const section = document.createElement('div');
        section.className = 'section';
        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = '<span class="section-label"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>客户端上传</span>' +
          '<span class="section-ip">' + escHtml(s.ip) + '</span>' +
          '<span class="section-count">' + countFiles(s.items) + ' 个文件</span>';
        section.appendChild(header);
        const rows = document.createElement('div');
        rows.className = 'section-rows';
        section.appendChild(rows);
        renderTree(s.items, rows, 0);
        treeEl.appendChild(section);
        anyRendered = true;
      }

      if (!anyRendered) {
        treeEl.innerHTML = q
          ? '<div class="empty-search">没有匹配「' + escHtml(searchQuery) + '」的文件</div>'
          : '<div class="empty-search">暂无共享文件</div>';
      }
    }

    // ===== Previewability =====
    const PREVIEW_TEXT_EXTS = ['txt', 'log', 'csv', 'json', 'xml', 'yml', 'yaml', 'toml', 'ini', 'cfg', 'conf', 'env', 'properties'];
    const PREVIEW_CODE_EXTS = ['js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx', 'py', 'java', 'c', 'cpp', 'h', 'hpp', 'rs', 'go', 'rb', 'php', 'swift', 'kt', 'kts', 'scala', 'dart', 'lua', 'r', 'sql', 'sh', 'bash', 'zsh', 'bat', 'cmd', 'ps1', 'html', 'htm', 'css', 'scss', 'less', 'vue', 'svelte', 'svg'];
    const PREVIEW_MD_EXTS = ['md', 'markdown', 'mdown', 'mkd'];
    const PREVIEW_IMG_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'ico'];
    const PREVIEW_AUDIO_EXTS = ['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a', 'wma'];
    const PREVIEW_VIDEO_EXTS = ['mp4', 'webm', 'mkv', 'avi', 'mov', 'flv', 'wmv'];

    function getFileCategory(ext) {
      if (PREVIEW_MD_EXTS.includes(ext)) return 'markdown';
      if (PREVIEW_CODE_EXTS.includes(ext)) return 'code';
      if (PREVIEW_TEXT_EXTS.includes(ext)) return 'text';
      if (PREVIEW_IMG_EXTS.includes(ext)) return 'image';
      if (PREVIEW_AUDIO_EXTS.includes(ext)) return 'audio';
      if (PREVIEW_VIDEO_EXTS.includes(ext)) return 'video';
      return 'binary';
    }

    function isPreviewable(ext) {
      return getFileCategory(ext) !== 'binary';
    }

    // ===== Render Tree =====
    function renderTree(items, parent, depth) {
      for (const item of items) {
        const container = document.createElement('div');
        const row = document.createElement('div');
        const ext = ((item.name || '').split('.').pop() || '').toLowerCase();
        const previewable = item.isDirectory || isPreviewable(ext);

        row.className = 'tree-item' + (item.isDirectory ? ' dir' : '');
        row.style.paddingLeft = (8 + depth * 22) + 'px';

        // Arrow
        if (item.isDirectory && item.children && item.children.length > 0) {
          row.classList.add('expanded');
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
          row.appendChild(arrow);
        } else {
          const spacer = document.createElement('span');
          spacer.style.cssText = 'width:18px;flex-shrink:0';
          row.appendChild(spacer);
        }

        // Icon
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = getIconSvg(item);
        row.appendChild(icon);

        // Name
        const name = document.createElement('span');
        name.className = 'name' + (!item.isDirectory && !previewable ? ' no-preview' : '');
        name.textContent = item.name;
        name.title = item.name;
        row.appendChild(name);

        // Non-previewable badge
        if (!item.isDirectory && !previewable) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '二进制';
          row.appendChild(badge);
        }

        // Download button (directories download as ZIP, files directly)
        if (item.isDirectory) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'dl-btn';
          dlBtn.title = '打包下载 ' + item.name;
          dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 8v12a2 2 0 01-2 2H5a2 2 0 01-2-2V8"/><polyline points="7 8 7 4 17 4 17 8"/><polyline points="3 8 21 8"/></svg>';
          dlBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            downloadZipPaths([item.path]);
          });
          row.appendChild(dlBtn);

          // Checkbox (select whole directory for bulk ZIP download)
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'tree-cb';
          cb.dataset.path = item.path;
          cb.dataset.name = item.name;
          cb.addEventListener('click', function (e) { e.stopPropagation(); updateBulkBar(); });
          row.appendChild(cb);
        } else {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'dl-btn';
          dlBtn.title = '下载 ' + item.name;
          dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
          dlBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            downloadFile(item.path, item.name);
          });
          row.appendChild(dlBtn);

          // Delete button — only for uploads made from this client's IP (or the owner)
          if (canDeleteOwnUpload(item)) {
            const delBtn = document.createElement('button');
            delBtn.className = 'dl-btn del';
            delBtn.title = '删除我上传的文件';
            delBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
            delBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              deleteUpload(item);
            });
            row.appendChild(delBtn);
          }

          // Checkbox
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'tree-cb';
          cb.dataset.path = item.path;
          cb.dataset.name = item.name;
          cb.addEventListener('click', function (e) { e.stopPropagation(); updateBulkBar(); });
          row.appendChild(cb);
        }

        row.addEventListener('click', function (e) {
          e.stopPropagation();
          if (item.isDirectory) {
            const childDiv = container.querySelector('.tree-children');
            if (childDiv) {
              childDiv.classList.toggle('collapsed');
              row.classList.toggle('expanded');
            }
          } else if (previewable) {
            openPreview(item.path, item.name, ext);
          }
        });

        container.appendChild(row);

        // Children
        if (item.children && item.children.length > 0) {
          const childDiv = document.createElement('div');
          childDiv.className = 'tree-children';
          renderTree(item.children, childDiv, depth + 1);
          container.appendChild(childDiv);
        }

        parent.appendChild(container);
      }
    }

    function getIconSvg(item) {
      if (item.isDirectory) {
        return '<svg viewBox="0 0 24 24" style="stroke:#f59e0b;fill:#fef3c7;stroke-width:1.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6.5l-1.5-2H5a2 2 0 00-2 2z"/></svg>';
      }
      const ext = (item.name || '').split('.').pop().toLowerCase();
      if (PREVIEW_AUDIO_EXTS.includes(ext)) {
        return '<svg viewBox="0 0 24 24" style="stroke:#8b5cf6;fill:none;stroke-width:1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
      }
      if (PREVIEW_VIDEO_EXTS.includes(ext)) {
        return '<svg viewBox="0 0 24 24" style="stroke:#ef4444;fill:none;stroke-width:1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      }
      if (PREVIEW_IMG_EXTS.includes(ext)) {
        return '<svg viewBox="0 0 24 24" style="stroke:#22c55e;fill:none;stroke-width:1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
      }
      if (PREVIEW_CODE_EXTS.includes(ext) || PREVIEW_MD_EXTS.includes(ext)) {
        return '<svg viewBox="0 0 24 24" style="stroke:#3b82f6;fill:none;stroke-width:1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      }
      return '<svg viewBox="0 0 24 24" style="stroke:var(--text3);fill:none;stroke-width:1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
    }

    // ===== Preview Modal =====
    function openPreview(filePath, fileName, ext) {
      currentFilePath = filePath;
      currentFileExt = ext;
      currentViewMode = 'preview';

      document.getElementById('modalTitle').textContent = fileName;
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('modalDownload').href = '/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '&dl=1';

      // Reset tabs
      document.querySelectorAll('.modal-tab').forEach((t, i) => t.classList.toggle('active', i === 0));

      const cat = getFileCategory(ext);
      const showTabs = cat === 'markdown' || cat === 'code';
      const isTextType = cat === 'markdown' || cat === 'code' || cat === 'text';
      document.getElementById('modalTabs').style.display = showTabs ? 'flex' : 'none';
      document.getElementById('modalCopyBtn').style.display = isTextType ? '' : 'none';

      const body = document.getElementById('modalBody');

      // Image
      if (cat === 'image') {
        const imgSrc = '/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN;
        body.innerHTML = '<img src="' + imgSrc + '" alt="' + escHtml(fileName) + '" style="max-width:100%;max-height:65vh;display:block;margin:0 auto;cursor:zoom-in" onclick="openImgViewer(\'' + imgSrc.replace(/'/g, "\\'") + '\')">';
        return;
      }
      // Audio
      if (cat === 'audio') {
        body.innerHTML = '<div style="text-align:center;padding:20px"><p style="margin-bottom:16px;font-weight:500">' + escHtml(fileName) + '</p><audio controls autoplay style="width:100%;max-width:500px"><source src="/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '"></audio></div>';
        return;
      }
      // Video
      if (cat === 'video') {
        body.innerHTML = '<video controls autoplay style="width:100%;max-height:55vh;display:block"><source src="/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '"></video>';
        return;
      }

      // Text/code/markdown
      body.innerHTML = '<div class="empty-hint"><span>加载中...</span></div>';
      fetch('/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN)
        .then(r => r.text())
        .then(text => {
          currentRawContent = text;
          renderPreview(text, ext);
        })
        .catch(err => {
          body.innerHTML = '<div class="empty-hint"><span style="color:var(--danger)">加载失败: ' + escHtml(err.message) + '</span></div>';
        });
    }

    function renderPreview(text, ext) {
      const body = document.getElementById('modalBody');
      const cat = getFileCategory(ext);

      if (currentViewMode === 'source') {
        const lines = text.split('\n');
        const pad = String(lines.length).length;
        const numbered = lines.map((l, i) => '<span style="color:var(--text3);user-select:none;margin-right:12px">' + String(i + 1).padStart(pad, ' ') + '</span>' + escHtml(l)).join('\n');
        body.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-all">' + numbered + '</pre>';
        return;
      }

      if (cat === 'markdown') {
        body.innerHTML = '<div class="md-body">' + parseMarkdown(text) + '</div>';
        return;
      }

      // Code or text
      const highlighted = (cat === 'code') ? highlightCode(text, ext) : escHtml(text);
      body.innerHTML = '<pre>' + highlighted + '</pre>';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      // Destroy media elements to stop playback
      document.getElementById('modalBody').innerHTML = '';
      currentFilePath = null;
      currentRawContent = '';
    }

    // ===== Fullscreen Image Viewer =====
    let viewerScale = 1, viewerX = 0, viewerY = 0;
    let viewerDragging = false, viewerLastX = 0, viewerLastY = 0;

    function openImgViewer(src) {
      const viewer = document.getElementById('imgViewer');
      const img = document.getElementById('imgViewerImg');
      img.src = src;
      viewerScale = 1; viewerX = 0; viewerY = 0;
      updateImgTransform();
      viewer.style.display = 'flex';
      document.getElementById('imgViewerZoom').textContent = '100%';
    }

    function closeImgViewer() {
      document.getElementById('imgViewer').style.display = 'none';
      document.getElementById('imgViewerImg').src = '';
    }

    function updateImgTransform() {
      const img = document.getElementById('imgViewerImg');
      img.style.transform = 'translate(' + viewerX + 'px,' + viewerY + 'px) scale(' + viewerScale + ')';
      document.getElementById('imgViewerZoom').textContent = Math.round(viewerScale * 100) + '%';
    }

    function initImgViewer() {
      const viewer = document.getElementById('imgViewer');
      const img = document.getElementById('imgViewerImg');

      document.getElementById('imgViewerClose').addEventListener('click', closeImgViewer);

      viewer.addEventListener('wheel', function (e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        viewerScale = Math.max(0.1, Math.min(20, viewerScale * delta));
        updateImgTransform();
      }, { passive: false });

      viewer.addEventListener('mousedown', function (e) {
        if (e.target === viewer || e.target === img) {
          viewerDragging = true;
          viewerLastX = e.clientX; viewerLastY = e.clientY;
          viewer.classList.add('dragging');
        }
      });

      document.addEventListener('mousemove', function (e) {
        if (!viewerDragging) return;
        viewerX += e.clientX - viewerLastX;
        viewerY += e.clientY - viewerLastY;
        viewerLastX = e.clientX; viewerLastY = e.clientY;
        updateImgTransform();
      });

      document.addEventListener('mouseup', function () {
        if (viewerDragging) { viewerDragging = false; viewer.classList.remove('dragging'); }
      });

      // Double-click to reset
      viewer.addEventListener('dblclick', function () {
        viewerScale = 1; viewerX = 0; viewerY = 0;
        updateImgTransform();
      });
    }

    // ===== Simple Markdown Parser =====
    function parseMarkdown(src) {
      let html = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // Fenced code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
        const h = lang ? highlightCode(code.trim(), lang) : escHtml(code.trim());
        return '<pre><code>' + h + '</code></pre>';
      });
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Headers
      html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      // HR
      html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');
      // Bold / Italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
      html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
      html = html.replace(/_(.+?)_/g, '<em>$1</em>');
      // Images
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
      // Links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      // Blockquotes
      html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');
      // Unordered lists
      html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
      // Paragraphs
      const lines = html.split('\n');
      const result = [];
      let inList = false;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('<h') || line.startsWith('<hr') || line.startsWith('<pre') || line.startsWith('<blockquote') || line.startsWith('<table')) {
          if (inList) { result.push('</ul>'); inList = false; }
          result.push(line);
        } else if (line.startsWith('<li>')) {
          if (!inList) { result.push('<ul>'); inList = true; }
          result.push(line);
        } else if (line.trim() === '') {
          if (inList) { result.push('</ul>'); inList = false; }
          result.push('');
        } else if (line.trim()) {
          if (inList) { result.push('</ul>'); inList = false; }
          result.push('<p>' + line + '</p>');
        } else {
          result.push(line);
        }
      }
      if (inList) result.push('</ul>');
      return result.join('\n');
    }

    // ===== Code Highlighting =====
    const KEYWORDS = {
      js: 'break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return super switch this throw try typeof var void while with yield async await static get set from as'.split(' '),
      py: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '),
      java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while'.split(' '),
      cpp: 'auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while class namespace template typename virtual public private protected new delete try catch throw nullptr override final'.split(' '),
      go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var'.split(' '),
      rs: 'as break const continue crate else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while async await dyn'.split(' '),
      sql: 'SELECT FROM WHERE AND OR NOT IN IS NULL LIKE BETWEEN JOIN INNER LEFT RIGHT OUTER ON AS ORDER BY GROUP HAVING LIMIT OFFSET INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE DROP ALTER INDEX VIEW UNION ALL DISTINCT COUNT SUM AVG MIN MAX CASE WHEN THEN ELSE END EXISTS PRIMARY KEY FOREIGN REFERENCES CASCADE'.split(' ')
    };
    function highlightCode(code, lang) {
      const keywords = KEYWORDS[lang] || KEYWORDS['js'];
      const kwPattern = '\\b(' + keywords.join('|') + ')\\b';
      let html = escHtml(code);
      // Line comments
      if (['js', 'ts', 'jsx', 'tsx', 'go', 'rs', 'java', 'cpp', 'c', 'swift', 'kt', 'scala', 'dart', 'php'].includes(lang)) {
        html = html.replace(/(\/\/.*$)/gm, '<span class="hljs-comment">$1</span>');
      }
      if (['py', 'rb', 'sh', 'bash', 'yaml', 'toml'].includes(lang)) {
        html = html.replace(/(#.*$)/gm, '<span class="hljs-comment">$1</span>');
      }
      if (lang === 'sql') {
        html = html.replace(/(--.*$)/gm, '<span class="hljs-comment">$1</span>');
      }
      // Block comments
      html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hljs-comment">$1</span>');
      // Strings
      html = html.replace(/(["'`])(?:(?!\1|\\).|\\.)*\1/g, '<span class="hljs-string">$&</span>');
      // Numbers
      html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="hljs-number">$1</span>');
      // Keywords
      html = html.replace(new RegExp(kwPattern, 'gi'), '<span class="hljs-keyword">$1</span>');
      // Function calls
      html = html.replace(/\b([a-zA-Z_$][\w$]*)\(/g, '<span class="hljs-function">$1</span>(');
      return html;
    }
    function escHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Clipboard helper (works on both HTTPS and HTTP)
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); return Promise.resolve(); }
      catch (e) { return Promise.reject(e); }
      finally { document.body.removeChild(ta); }
    }

    // Toast
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('webToast');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2000);
    }

    // ===== Download & Bulk Actions =====
    function downloadFile(filePath, fileName) {
      const a = document.createElement('a');
      a.href = '/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '&dl=1';
      a.download = fileName;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

    // Download one or more paths as a single ZIP archive
    function downloadZipPaths(paths) {
      if (!paths || paths.length === 0) return;
      const url = '/api/zip?token=' + TOKEN + paths.map(p => '&path=' + encodeURIComponent(p)).join('');
      const a = document.createElement('a');
      a.href = url;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('正在打包下载...');
    }

    function getCheckedFiles() {
      const cbs = document.querySelectorAll('.tree-cb:checked');
      const files = [];
      cbs.forEach(cb => {
        if (cb.dataset.path) files.push({ path: cb.dataset.path, name: cb.dataset.name });
      });
      return files;
    }

    // Drop paths that live inside another selected path (avoids duplicates in ZIP)
    function dedupePaths(paths) {
      const sorted = paths.slice().sort((a, b) => a.length - b.length);
      const result = [];
      for (const p of sorted) {
        const norm = p.replace(/\\/g, '/');
        if (!result.some(r => norm.startsWith(r.replace(/\\/g, '/') + '/'))) {
          result.push(p);
        }
      }
      return result;
    }

    function updateBulkBar() {
      const files = getCheckedFiles();
      document.getElementById('bulkCount').textContent = '已选择 ' + files.length;
      // Update select-all checkbox state
      const allCbs = document.querySelectorAll('.tree-cb[data-path]');
      const checkedCbs = document.querySelectorAll('.tree-cb[data-path]:checked');
      document.getElementById('selectAllCb').checked = allCbs.length > 0 && checkedCbs.length === allCbs.length;
      document.getElementById('selectAllCb').indeterminate = checkedCbs.length > 0 && checkedCbs.length < allCbs.length;
    }

    function selectAllFiles() {
      const checked = document.getElementById('selectAllCb').checked;
      document.querySelectorAll('.tree-cb[data-path]').forEach(cb => { cb.checked = checked; });
      updateBulkBar();
    }

    function downloadSelected() {
      const files = getCheckedFiles();
      if (files.length === 0) return;
      downloadZipPaths(dedupePaths(files.map(f => f.path)));
    }

    function downloadAllFiles() {
      document.querySelectorAll('.tree-cb[data-path]').forEach(cb => { cb.checked = true; });
      updateBulkBar();
      downloadZipPaths(fileTree.map(item => item.path));
