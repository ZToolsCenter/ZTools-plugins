<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件共享</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg: #ffffff;
      --bg2: #f8fafc;
      --bg3: #f1f5f9;
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-light: #dbeafe;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
      --success: #22c55e;
      --success-light: #dcfce7;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #64748b;
      --border: #334155;
      --primary-light: #1e3a5f;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
    }

    /* ===== Layout ===== */
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.5;
    }

    .header-left h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-right .file-count {
      font-size: 12px;
      color: var(--text3);
    }

    /* ===== Local / remote access pill ===== */
    .access-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: default;
      user-select: none;
    }

    .access-pill .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .access-pill.local {
      background: #dcfce7;
      color: #15803d;
    }

    .access-pill.local .pill-dot {
      background: #22c55e;
    }

    .access-pill.remote {
      background: var(--bg3);
      color: var(--text2);
    }

    .access-pill.remote .pill-dot {
      background: var(--text3);
    }

    [data-theme="dark"] .access-pill.local {
      background: #14532d;
      color: #4ade80;
    }

    .local-hint {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border-radius: var(--radius);
      background: var(--primary-light);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
      flex-wrap: wrap;
    }

    .local-hint.show {
      display: flex;
    }

    .local-hint code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--primary);
      word-break: break-all;
    }

    .local-hint .copy-mini {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 5px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .local-hint .copy-mini:hover {
      background: #2563eb;
    }

    .theme-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .theme-btn:hover {
      background: var(--bg3);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text2);
      fill: none;
      stroke-width: 2;
    }

    /* ===== File Tree ===== */
    .tree {}

    .tree-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      gap: 8px;
      border-radius: 6px;
      transition: background 0.1s;
      cursor: pointer;
      min-height: 38px;
    }

    .tree-item:hover {
      background: var(--bg2);
    }

    .tree-item .arrow {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
      color: var(--text3);
    }

    .tree-item .arrow svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .tree-item.dir.expanded>.arrow {
      transform: rotate(90deg);
    }

    .tree-item .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tree-item .icon svg {
      width: 18px;
      height: 18px;
    }

    .tree-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .tree-item .name.no-preview {
      color: var(--text3);
      cursor: default;
    }

    .tree-item .size {
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .tree-item .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--bg3);
      color: var(--text3);
      flex-shrink: 0;
    }

    .tree-children {
      margin-left: 20px;
    }

    .tree-children.collapsed {
      display: none;
    }

    /* ===== Modal Overlay ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 0.15s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal {
      background: var(--bg);
      border-radius: 12px;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .modal-header .modal-title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-header .modal-tabs {
      display: flex;
      gap: 0;
    }

    .modal-header .modal-tab {
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 4px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-header .modal-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .modal-close:hover {
      background: var(--bg3);
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
      stroke: var(--text2);
      fill: none;
      stroke-width: 2;
    }

    .modal-body {
      flex: 1;
      overflow: auto;
      padding: 20px 24px;
    }

    .modal-body img {
      max-width: 100%;
      border-radius: var(--radius);
      display: block;
      margin: 0 auto;
    }

    .modal-body audio {
      width: 100%;
      max-width: 500px;
      display: block;
      margin: 20px auto;
      outline: none;
    }

    .modal-body video {
      width: 100%;
      max-height: 60vh;
      border-radius: var(--radius);
      outline: none;
    }

    .modal-body pre {
      background: var(--bg3);
      border-radius: var(--radius);
      padding: 16px 20px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .modal-body code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
    }

    .modal-body .empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text3);
      gap: 8px;
    }

    .modal-body .empty-hint svg {
      width: 40px;
      height: 40px;
      stroke: var(--text3);
      fill: none;
      stroke-width: 1.5;
    }

    /* ===== Fullscreen Image Viewer ===== */
    .img-viewer {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
    }

    .img-viewer.dragging {
      cursor: grabbing;
    }

    .img-viewer img {
      max-width: none;
      max-height: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform-origin: center center;
      transition: transform 0.05s linear;
    }

    .img-viewer-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
    }

    .img-viewer-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      z-index: 1;
    }

    .img-viewer-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .img-viewer-close svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
    }

    .img-viewer-zoom {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
    }

    /* ===== Confirm Dialog (unified custom styling, no native dialogs) ===== */
    .confirm-modal {
      width: 100%;
      max-width: 380px;
    }

    .confirm-body {
      padding: 26px 24px 6px;
      text-align: center;
    }

    .confirm-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #fef2f2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    [data-theme="dark"] .confirm-icon {
      background: #3b1515;
    }

    .confirm-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--danger);
      fill: none;
      stroke-width: 2;
    }

    .confirm-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .confirm-msg {
      font-size: 13px;
      color: var(--text2);
      word-break: break-all;
      line-height: 1.6;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
      padding: 20px 24px 24px;
    }

    .confirm-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      transition: all 0.15s;
    }

    .confirm-btn:hover {
      background: var(--bg3);
    }

    .confirm-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .confirm-btn.primary:hover {
      background: #2563eb;
    }

    .confirm-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .confirm-btn.danger:hover {
      background: #dc2626;
    }

    /* ===== Markdown rendered ===== */
    .md-body {
      line-height: 1.7;
    }

    .md-body h1 {
      font-size: 1.6em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin: 20px 0 12px;
    }

    .md-body h2 {
      font-size: 1.35em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin: 18px 0 10px;
    }

    .md-body h3 {
      font-size: 1.15em;
      margin: 14px 0 8px;
    }

    .md-body h4,
    .md-body h5,
    .md-body h6 {
      font-size: 1.05em;
      margin: 10px 0 6px;
    }

    .md-body p {
      margin: 6px 0;
    }

    .md-body ul,
    .md-body ol {
      padding-left: 22px;
      margin: 6px 0;
    }

    .md-body li {
      margin: 2px 0;
    }

    .md-body blockquote {
      border-left: 3px solid var(--primary);
      padding: 4px 14px;
      margin: 10px 0;
      background: var(--bg2);
      border-radius: 0 4px 4px 0;
      color: var(--text2);
    }

    .md-body code {
      background: var(--bg3);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .md-body pre {
      margin: 10px 0;
    }

    .md-body pre code {
      background: none;
      padding: 0;
    }

    .md-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }

    .md-body th,
    .md-body td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      font-size: 13px;
    }

    .md-body th {
      background: var(--bg2);
      font-weight: 600;
    }

    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .md-body a {
      color: var(--primary);
    }

    .md-body img {
      max-width: 100%;
      border-radius: 4px;
    }

    /* ===== Syntax Highlighting ===== */
    .hljs-keyword {
      color: #7c3aed;
    }

    .hljs-string {
      color: #059669;
    }

    .hljs-comment {
      color: #94a3b8;
      font-style: italic;
    }

    .hljs-number {
      color: #d97706;
    }

    .hljs-function {
      color: #2563eb;
    }

    .hljs-type {
      color: #0891b2;
    }

    .hljs-attr {
      color: #c026d3;
    }

    .hljs-builtin {
      color: #dc2626;
    }

    [data-theme="dark"] .hljs-keyword {
      color: #a78bfa;
    }

    [data-theme="dark"] .hljs-string {
      color: #34d399;
    }

    [data-theme="dark"] .hljs-comment {
      color: #64748b;
    }

    [data-theme="dark"] .hljs-number {
      color: #fbbf24;
    }

    [data-theme="dark"] .hljs-function {
      color: #60a5fa;
    }

    [data-theme="dark"] .hljs-type {
      color: #22d3ee;
    }

    [data-theme="dark"] .hljs-attr {
      color: #e879f9;
    }

    [data-theme="dark"] .hljs-builtin {
      color: #f87171;
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ===== Toast ===== */
    .web-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: #1e293b;
      color: #fff;
      padding: 8px 22px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .web-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Bulk actions bar ===== */
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .bulk-bar .bulk-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bulk-bar .bulk-btn:hover {
      background: var(--bg3);
    }

    .bulk-bar .bulk-btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .bulk-bar .bulk-btn.primary:hover {
      background: #2563eb;
    }

    .bulk-bar .bulk-count {
      font-size: 12px;
      color: var(--text2);
    }

    /* Checkbox */
    .tree-cb {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      margin: 0;
    }

    .tree-cb:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .tree-cb:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Download button per row */
    .dl-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--text3);
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .dl-btn:hover {
      background: var(--bg3);
      color: var(--primary);
    }

    .dl-btn.del:hover {
      background: #fef2f2;
      color: var(--danger);
    }

    [data-theme="dark"] .dl-btn.del:hover {
      background: #3b1515;
    }

    .dl-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ===== Search Box ===== */
    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 10px;
      height: 34px;
      min-width: 140px;
      transition: border-color 0.15s;
    }

    .search-box:focus-within {
      border-color: var(--primary);
    }

    .search-box svg {
      width: 14px;
      height: 14px;
      stroke: var(--text3);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text3);
    }

    .search-clear {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      flex-shrink: 0;
    }

    .search-clear:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .search-clear svg {
      width: 10px;
      height: 10px;
    }

    /* ===== Upload button ===== */
    .upload-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .upload-btn:hover {
      background: #2563eb;
    }

    .upload-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ===== Section grouping (host shares vs client uploads) ===== */
    .section {
      margin-bottom: 4px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 2px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }

    .section-header .section-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-header .section-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.5;
    }

    .section-header .section-ip {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: var(--primary);
      font-weight: 500;
      font-size: 11px;
      background: var(--primary-light);
      padding: 1px 8px;
      border-radius: 10px;
    }

    .section-header .section-count {
      font-weight: 400;
      color: var(--text3);
      margin-left: auto;
    }

    /* ===== Upload progress panel ===== */
    .upload-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 320px;
      max-width: calc(100vw - 40px);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 1500;
      overflow: hidden;
      display: none;
    }

    .upload-panel.show {
      display: block;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .upload-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .upload-panel-header svg {
      width: 14px;
      height: 14px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
    }

    .upload-panel-title {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }

    .upload-panel-close {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      flex-shrink: 0;
    }

    .upload-panel-close:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .upload-panel-close svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
    }

    .upload-panel-body {
      max-height: 300px;
      overflow-y: auto;
    }

    .upload-row {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .upload-row:last-child {
      border-bottom: none;
    }

    .upload-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-row-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .upload-row-icon svg {
      width: 16px;
      height: 16px;
    }

    .upload-row-icon.uploading svg {
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .upload-row-icon.done svg {
      stroke: var(--success);
      fill: none;
      stroke-width: 2;
    }

    .upload-row-icon.error svg {
      stroke: var(--danger);
      fill: none;
      stroke-width: 2;
    }

    .upload-row-name {
      flex: 1;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-row-status {
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .upload-row-status.done {
      color: var(--success);
    }

    .upload-row-status.error {
      color: var(--danger);
    }

    .progress-track {
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.15s ease;
    }

    .progress-fill.done {
      background: var(--success);
    }

    .progress-fill.error {
      background: var(--danger);
    }

    /* ===== Drag & drop overlay ===== */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .drop-overlay.show {
      display: flex;
    }

    .drop-box {
      background: var(--bg);
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 48px 64px;
      text-align: center;
      pointer-events: none;
    }

    .drop-box svg {
      width: 48px;
      height: 48px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 16px;
    }

    .drop-box-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .drop-box-desc {
      font-size: 13px;
      color: var(--text2);
    }

    /* ===== Empty search result ===== */
    .empty-search {
      padding: 40px 20px;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
    }

    /* ===== P2P private messaging ===== */
    .p2p-btn {
      position: relative;
    }

    .p2p-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 8px;
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg);
      line-height: 15px;
    }

    .p2p-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1199;
    }

    .p2p-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      max-width: 100vw;
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 1200;
      display: flex;
      flex-direction: column;
      animation: drawerIn 0.18s ease-out;
    }

    @keyframes drawerIn {
      from {
        transform: translateX(40px);
        opacity: 0.4;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .p2p-drawer-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .p2p-drawer-title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .p2p-drawer-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      cursor: pointer;
      flex-shrink: 0;
    }

    .p2p-drawer-close:hover {
      background: var(--bg3);
    }

    .p2p-reconnect {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px;
      font-size: 11px;
      color: var(--text2);
      background: var(--warning-light);
      border-bottom: 1px solid var(--border);
    }

    .p2p-reconnect.show {
      display: flex;
    }

    .p2p-drawer-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* states */
    .p2p-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px 24px;
      text-align: center;
      color: var(--text2);
      font-size: 13px;
      flex: 1;
    }

    .p2p-state svg {
      stroke: var(--text3);
      fill: none;
      stroke-width: 1.2;
    }

    .p2p-state-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .p2p-state-sub {
      font-size: 12px;
      color: var(--text3);
    }

    .p2p-form {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .p2p-form label {
      font-size: 12px;
      color: var(--text2);
    }

    .p2p-form input,
    .p2p-form textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 13px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }

    .p2p-form input:focus,
    .p2p-form textarea:focus {
      border-color: var(--primary);
    }

    .p2p-submit {
      height: 38px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }

    .p2p-submit:hover {
      background: #2563eb;
    }

    .p2p-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* chat */
    .p2p-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .p2p-chat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .p2p-peer-name {
      font-size: 13px;
      font-weight: 600;
    }

    .p2p-peer-ip {
      font-size: 11px;
      color: var(--text3);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .p2p-online {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }

    .p2p-online.on {
      background: var(--success);
    }

    .p2p-chat-del {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .p2p-chat-del:hover {
      color: var(--danger);
      background: var(--danger-light);
    }

    .p2p-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg2);
    }

    .p2p-msg {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      cursor: default;
    }

    .p2p-msg.mine {
      align-items: flex-end;
    }

    .p2p-msg-time {
      font-size: 10px;
      color: var(--text3);
    }

    /* Message head layout: theirs = [时间][复制][删除], mine = [删除][复制][时间] */
    .p2p-msg.theirs .p2p-msg-time {
      order: 0;
    }

    .p2p-msg.theirs .p2p-msg-copy {
      order: 1;
    }

    .p2p-msg.theirs .p2p-msg-del {
      order: 2;
    }

    .p2p-msg.mine .p2p-msg-del {
      order: 0;
    }

    .p2p-msg.mine .p2p-msg-copy {
      order: 1;
    }

    .p2p-msg.mine .p2p-msg-time {
      order: 2;
    }

    .p2p-msg-del {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.12s;
      padding: 0;
      flex-shrink: 0;
    }

    .p2p-msg-copy {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.12s;
      padding: 0;
      flex-shrink: 0;
    }

    .p2p-msg-del:hover {
      opacity: 1;
      background: var(--danger-light);
      color: var(--danger);
    }

    .p2p-msg-copy:hover {
      opacity: 1;
      background: var(--bg3);
      color: var(--primary);
    }

    .p2p-msg-copy.copied {
      opacity: 1;
      color: var(--success);
      background: var(--success-light);
    }

    [data-theme="dark"] .p2p-msg-copy.copied {
      background: #14532d;
    }

    .p2p-file-item {
      display: flex;
      gap: 10px;
      padding: 5px 4px;
    }

    .p2p-bubble {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: default;
      user-select: text;
    }

    .p2p-msg.theirs .p2p-bubble {
      background: var(--bg);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
      color: var(--text);
    }

    .p2p-msg.mine .p2p-bubble {
      background: var(--primary);
      color: #fff;
      border-top-right-radius: 2px;
    }

    .p2p-system {
      text-align: center;
      font-size: 11px;
      color: var(--text3);
      padding: 2px 0;
    }

    .p2p-file {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      max-width: 340px;
      min-width: 230px;
    }

    .p2p-msg.mine .p2p-file {
      background: var(--primary-light);
      border-color: var(--primary-light);
    }

    .p2p-msg.mine .p2p-file-item+.p2p-file-item {
      border-color: rgba(0, 0, 0, 0.08);
    }

    .p2p-file-icon {
      color: var(--primary);
      flex-shrink: 0;
    }

    .p2p-file-name {
      font-size: 12px;
      font-weight: 600;
      word-break: break-all;
    }

    .p2p-file-meta {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    .p2p-file-actions {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }

    .p2p-file-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--primary);
      cursor: pointer;
    }

    .p2p-file-btn:hover {
      background: var(--primary-light);
    }

    .p2p-inputbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .p2p-file-send {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      flex-shrink: 0;
    }

    .p2p-file-send:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .p2p-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      min-height: 34px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 96px;
    }

    .p2p-input:focus {
      border-color: var(--primary);
    }

    .p2p-send {
      height: 34px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .p2p-send:hover {
      background: #2563eb;
    }

    .p2p-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .p2p-upload-row {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
    }

    .p2p-upload-row.show {
      display: flex;
    }

    .p2p-upload-name {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .p2p-upload-track {
      flex: 1;
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }

    .p2p-upload-fill {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.15s;
    }

    .p2p-upload-pct {
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
    }

    /* ===== Host management console (local browser) ===== */
    .host-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .host-list {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 8px 0;
    }

    .host-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 699px) {
      .host-body.host-view-list .host-chat {
        display: none;
      }

      .host-body.host-view-chat .host-list {
        display: none;
      }

      .host-list {
        width: 100%;
        border-right: none;
      }
    }

    /* ===== Host console session list ===== */
    .p2p-group-label {
      font-size: 11px;
      color: var(--text3);
      padding: 10px 16px 4px;
    }

    .p2p-session {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .p2p-session:hover {
      background: var(--bg2);
    }

    .p2p-session.active {
      background: var(--primary-light);
    }

    .p2p-session.pending {
      background: var(--bg2);
      border-left: 3px solid var(--warning);
      cursor: default;
    }

    .p2p-session-main {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }

    .p2p-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .p2p-session-info {
      min-width: 0;
      flex: 1;
    }

    .p2p-session-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
    }

    .p2p-session-ip {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
      font-weight: 400;
      color: var(--text3);
    }

    .p2p-session-preview {
      font-size: 11px;
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    .p2p-session-side {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .p2p-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
    }

    .p2p-status-dot.online {
      background: var(--success);
    }

    .p2p-status-text {
      font-size: 10px;
      color: var(--text3);
      white-space: nowrap;
    }

    .p2p-unread {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p2p-del {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--text3);
      cursor: pointer;
      flex-shrink: 0;
    }

    .p2p-del:hover {
      background: var(--danger-light);
      color: var(--danger);
    }

    .p2p-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text2);
      cursor: pointer;
      white-space: nowrap;
    }

    .p2p-btn.accept {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .p2p-btn.reject {
      color: var(--danger);
      border-color: var(--border);
    }

    .p2p-btn.reject:hover {
      background: var(--danger-light);
    }

    /* ===== Host layout (local browser): side menu + content ===== */
    .app.app-host {
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      height: 100vh;
      min-height: 100vh;
      padding-bottom: 24px;
      overflow: hidden;
    }

    .layout-row {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .side-menu {
      width: 148px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text2);
      cursor: pointer;
      background: none;
      border: none;
      position: relative;
      font-family: inherit;
    }

    .side-tab:hover {
      background: var(--bg2);
      color: var(--text);
    }

    .side-tab.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .side-tab svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .side-badge {
      position: absolute;
      right: 8px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 16px;
    }

    .main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #filesView {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 0;
      padding: 0 14px;
    }

    #messagesView {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    #messagesViewBody {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 767px) {
      .side-menu {
        display: none;
      }

      .app.app-host {
        max-width: 100%;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
    }

    /* mobile bottom nav */
    .mobile-nav {
      display: none;
    }

    @media (max-width: 767px) {
      .p2p-drawer {
        width: 100%;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg);
        border-top: 1px solid var(--border);
        z-index: 900;
        height: 54px;
        padding-bottom: env(safe-area-inset-bottom);
      }

      .mobile-nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 11px;
        color: var(--text2);
        cursor: pointer;
        position: relative;
        background: none;
        border: none;
        font-family: inherit;
      }

      .mobile-nav-btn.active {
        color: var(--primary);
      }

      .mobile-nav-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }

      .mobile-nav-badge {
        position: absolute;
        top: 4px;
        left: 50%;
        margin-left: 8px;
        min-width: 15px;
        height: 15px;
        padding: 0 3px;
        border-radius: 8px;
        background: var(--danger);
        color: #fff;
        font-size: 9px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 15px;
      }

      .app {
        padding-bottom: 74px;
      }

      .p2p-inputbar {
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">

          <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6.5l-1.5-2H5a2 2 0 00-2 2z" stroke-width="1.5" />

        <button class="theme-btn" id="refreshBtn" title="刷新文件列表">

            <path
              d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" />
          </svg>

  <!-- Mobile bottom nav -->

          d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" />
