<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>悬浮图片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 关键：display 声明会盖掉 [hidden] 的默认样式，必须显式兜一层 */
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d11;
      cursor: move;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #pin {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      -webkit-user-drag: none;
    }

    #close {
      position: fixed;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 7px;
      background: rgba(14, 16, 20, 0.62);
      color: #f2f5f9;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.16s ease, background 0.16s ease;
    }

    body:hover #close { opacity: 1; }
    #close:hover { background: rgba(200, 62, 62, 0.9); }

    #menu {
      position: fixed;
      min-width: 132px;
      max-height: calc(100vh - 8px);
      overflow-y: auto;
      padding: 4px;
      border-radius: 10px;
      background: rgba(18, 20, 25, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    #menu button {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #dfe4ec;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    #menu button:hover { background: rgba(255, 255, 255, 0.09); }
    #menu button span { color: #7d8794; font-size: 11px; }
    #menu .danger:hover { background: rgba(220, 70, 70, 0.2); color: #ffc9c9; }
    #menu .sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, 0.09); }

    #tip {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(14, 16, 20, 0.7);
      color: #cbd3de;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #tip.show { opacity: 1; }

    /* ── 裁剪 ── */
    html.cropping, html.cropping body { cursor: crosshair; }

    #cropLayer {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    #cropBox {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.46);
      background-image:
        linear-gradient(to right, rgba(255,255,255,.26) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.26) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
      background-position: -1px -1px;
    }

    /* 四角与四边的小握把 */
    #cropBox::before,
    #cropBox::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 3px solid transparent;
    }

    #cropBar {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 12px;
      border-radius: 999px;
      background: rgba(14, 16, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(10px);
      z-index: 40;
      white-space: nowrap;
    }

    #cropBar span { color: #b9c2cf; font-size: 11.5px; }

    #cropBar button {
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: transparent;
      color: #e6eaf1;
      font-size: 11.5px;
      cursor: pointer;
    }

    #cropBar button:hover { background: rgba(255, 255, 255, 0.1); }

    #cropBar button[data-act="apply"] {
      background: rgba(126, 166, 224, 0.9);
      border-color: transparent;
      color: #10131a;
      font-weight: 600;
    }

    #cropBar button[data-act="apply"]:hover { background: rgba(146, 182, 232, 1); }
  </style>
</head>
<body>
  <img id="pin" alt="" draggable="false" />
  <button id="close" title="关闭 (Esc)">✕</button>

  <div id="cropLayer" hidden>
    <div id="cropBox"></div>
  </div>
  <div id="cropBar" hidden>
    <span>拖边调整，Enter 确认</span>
    <button data-act="apply">裁剪</button>
    <button data-act="cancel">取消</button>
  </div>

  <div id="tip"></div>
  <script src="src/shared.js"></script>
  <script src="src/pin.js"></script>
</body>
</html>
